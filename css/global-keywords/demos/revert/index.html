<!DOCTYPE html>
<html lang="ru">
<head>
  <title>revert — Глобальные ключевые слова — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      padding: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #18191C;
      color: #FFFFFF;
      font-size: 24px;
      font-family: "Roboto", sans-serif;
    }

    body {
      flex-direction: column;
      align-items: flex-start;
      gap: 20px;
    }

    h1 {
      font-size: 14px;
    }

    /* Возвращаем размер из стилей браузера */
    .reverted {
      font-size: revert;
    }

    .label {
      color: rgb(255 255 255 / 0.6);
      font-size: 16px;
    }

    @media (width <= 768px) {
      body {
        padding: 30px;
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div>
    <p class="label">font-size: 14px</p>
    <h1>Заголовок первого уровня</h1>
  </div>
  <div>
    <p class="label">font-size: revert</p>
    <h1 class="reverted">Заголовок первого уровня</h1>
  </div>
</body>
</html>
