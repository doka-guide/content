<!DOCTYPE html>
<html lang="ru">
<head>
  <title>auto и pixelated — image-rendering — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono:wght@400&display=swap">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      padding: 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background-color: #18191C;
      color: #FFFFFF;
      font-family: "Roboto", sans-serif;
    }

    code {
      font-family: "Roboto Mono", monospace;
    }

    /* Сравнение: слева auto, справа pixelated */
    .compare {
      --split: 50%;
      --scale: 12;
      position: relative;
      width: min(320px, 100%);
      aspect-ratio: 1;
      overflow: hidden;
      border-radius: 6px;
      background-color: #282A2E;
    }

    .compare:has(.split:focus-visible) {
      outline: 2px solid #2E9AFF;
      outline-offset: 4px;
    }

    .layer {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      display: grid;
      place-items: center;
    }

    .layer img {
      width: calc(16px * var(--scale));
      height: calc(16px * var(--scale));
      max-width: none;
    }

    .layer-left {
      clip-path: inset(0 calc(100% - var(--split)) 0 0);
    }

    .layer-left img {
      image-rendering: auto;
    }

    .layer-right {
      clip-path: inset(0 0 0 var(--split));
    }

    .layer-right img {
      image-rendering: pixelated;
    }

    /* Разделитель */
    .divider {
      position: absolute;
      top: 0;
      bottom: 0;
      left: var(--split);
      width: 2px;
      background-color: #2E9AFF;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .divider::after {
      position: absolute;
      bottom: 12px;
      left: 50%;
      content: "‹ ›";
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border: 2px solid #2E9AFF;
      border-radius: 50%;
      background-color: #18191C;
      color: #2E9AFF;
      font-size: 12px;
      transform: translateX(-50%);
    }

    /* Подписи половин */
    .label {
      position: absolute;
      top: 12px;
      padding: 4px 8px;
      border-radius: 4px;
      background-color: rgb(24 25 28 / 0.8);
      font-size: 14px;
      pointer-events: none;
    }

    .label-left {
      left: 12px;
    }

    .label-right {
      right: 12px;
    }

    /* Выбор значения для правой половины */
    .values {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      max-width: 100%;
      border: none;
    }

    .values label {
      position: relative;
    }

    .values input {
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
    }

    .values span {
      display: block;
      padding: 6px 10px;
      border: 1px solid #2E9AFF;
      border-radius: 4px;
      background-color: #282A2E;
      font-family: "Roboto Mono", monospace;
      font-size: 14px;
      cursor: pointer;
    }

    .values input:checked + span {
      background-color: #2E9AFF;
      color: #18191C;
    }

    .values input:focus-visible + span {
      outline: 2px solid #FFFFFF;
      outline-offset: 2px;
    }

    .note {
      width: min(320px, 100%);
      min-height: 2lh;
      font-size: 14px;
      line-height: 1.4;
      color: #F498AD;
      text-align: center;
    }

    /* Невидимый ползунок поверх картинки: его тянут мышью, пальцем или стрелками */
    .split {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      appearance: none;
      background: none;
      opacity: 0;
      cursor: ew-resize;
      touch-action: none;
    }

    .split::-webkit-slider-thumb {
      appearance: none;
      width: 32px;
      height: 320px;
    }

    .split::-moz-range-thumb {
      width: 32px;
      height: 320px;
    }

    /* Масштаб */
    .scale {
      display: flex;
      align-items: center;
      gap: 12px;
      width: min(320px, 100%);
      font-size: 16px;
    }

    .scale input {
      flex-grow: 1;
      accent-color: #2E9AFF;
    }

    .scale output {
      min-width: 3.5ch;
      text-align: right;
    }

    @media (width <= 768px) {
      body {
        padding: 30px;
      }
    }
  </style>
</head>
<body>
  <fieldset class="values" aria-label="Значение для правой половины">
    <label><input type="radio" name="value" value="pixelated" checked><span>pixelated</span></label>
    <label><input type="radio" name="value" value="crisp-edges"><span>crisp-edges</span></label>
    <label><input type="radio" name="value" value="smooth"><span>smooth</span></label>
    <label><input type="radio" name="value" value="high-quality"><span>high-quality</span></label>
  </fieldset>

  <div class="compare">
    <div class="layer layer-left">
      <img src="../images/cat.png" alt="Пиксельная мордочка кошки, левая половина">
      <code class="label label-left">auto</code>
    </div>
    <div class="layer layer-right">
      <img src="../images/cat.png" alt="Та же мордочка кошки, правая половина">
      <code class="label label-right">pixelated</code>
    </div>
    <div class="divider"></div>
    <input class="split" type="range" min="0" max="100" value="50" aria-label="Граница между половинами">
  </div>

  <label class="scale">
    Масштаб
    <input class="scale-range" type="range" min="1" max="20" step="0.5" value="12">
    <output class="scale-value">12×</output>
  </label>

  <p class="note" aria-live="polite"></p>

  <script>
    const compare = document.querySelector('.compare');
    const split = document.querySelector('.split');
    const scaleRange = document.querySelector('.scale-range');
    const scaleValue = document.querySelector('.scale-value');
    const values = document.querySelectorAll('.values input');
    const rightImg = document.querySelector('.layer-right img');
    const rightLabel = document.querySelector('.label-right');
    const note = document.querySelector('.note');

    // Значение, которое браузер не понимает, рисуем как auto и пишем об этом
    values.forEach((input) => {
      input.addEventListener('change', () => {
        const supported = CSS.supports('image-rendering', input.value);
        rightImg.style.imageRendering = supported ? input.value : 'auto';
        rightLabel.textContent = input.value;
        note.textContent = supported
          ? ''
          : `Этот браузер не понимает ${input.value}, поэтому рисует картинку как при auto`;
      });
    });

    split.addEventListener('input', () => {
      compare.style.setProperty('--split', `${split.value}%`);
    });

    scaleRange.addEventListener('input', () => {
      compare.style.setProperty('--scale', scaleRange.value);
      scaleValue.textContent = `${scaleRange.value.replace('.', ',')}×`;
    });
  </script>
</body>
</html>
