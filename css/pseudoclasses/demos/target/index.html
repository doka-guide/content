<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Подсветка активной секции — Псевдоклассы — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      padding: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #18191C;
      color: #FFFFFF;
      font-size: 16px;
      font-family: "Roboto", sans-serif;
    }

    .container {
      width: 100%;
      max-width: 580px;
    }

    .menu {
      margin-bottom: 25px;
      font-size: 22px;
      font-weight: 500;
    }

    .link {
      color: #FFFFFF;
      text-decoration-color: #2E9AFF;
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
    }

    .link:hover {
      background-color: #2E9AFF;
      border-radius: 3px;
    }

    .sections {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .section {
      padding: 15px 20px;
      border-radius: 6px;
      background-color: #FFFFFF;
      color: #123E66;
      line-height: 1.4;
    }

    .source {
      border-top: 2px solid #2E9AFF;
      margin-top: 10px;
      padding-top: 5px;
      font-size: 13px;
      font-style: italic;
    }

    /* Якорь — пустой элемент перед карточкой. У него нет блока,
       поэтому браузер не прокручивает к нему страницу */
    :target + .section {
      background-color: #2E9AFF;
      color: #000000;
    }

    :target + .section .source {
      border-color: #000000;
    }

    @media (width <= 768px) {
      body {
        padding: 30px;
      }
    }

    @media (width <= 480px) {
      .menu {
        font-size: 20px;
      }

      .sections {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .section {
        padding: 10px 15px;
      }

      .source {
        margin-top: 5px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <nav class="menu">
      Про яблоки: <a class="link" href="#one">раз</a>, <a class="link" href="#two">два</a>, <a class="link" href="#three">три</a>, <a class="link" href="#four">четыре</a>
    </nav>
    <div class="sections">
      <span id="one" hidden></span>
      <section class="section">
        <p>…серые в яблоках, вороные, гнедые.</p>
        <footer class="source">И. С. Тургенев</footer>
      </section>
      <span id="two" hidden></span>
      <section class="section">
        <p>…по одному повреждённому яблоку.</p>
        <footer class="source">М. Е. Салтыков-Щедрин</footer>
      </section>
      <span id="three" hidden></span>
      <section class="section">
        <p>Как свёкла губы красные,<br>По яблоку — глаза!</p>
        <footer class="source">Н. А. Некрасов</footer>
      </section>
      <span id="four" hidden></span>
      <section class="section">
        <p>…связками сушёных груш и яблок…</p>
        <footer class="source">Н. В. Гоголь</footer>
      </section>
    </div>
  </div>
</body>
</html>
