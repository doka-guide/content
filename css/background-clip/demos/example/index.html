<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Три значения background-clip — background-clip — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      padding: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #18191C;
      color: #FFFFFF;
      font-family: "Roboto", sans-serif;
    }

    /* === стили демо === */

    .demo {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 400px;
    }

    .box {
      padding: 24px;
      border: 12px dashed rgb(255 255 255 / 0.3);
      background-color: #2E9AFF;
      font-size: 14px;
      font-weight: 500;
      color: #18191C;
      border-radius: 4px;
    }

    .label {
      font-size: 12px;
      color: rgb(255 255 255 / 0.5);
      margin-bottom: 4px;
      font-family: monospace;
    }

    .border-box  { background-clip: border-box; }
    .padding-box { background-clip: padding-box; }
    .content-box { background-clip: content-box; }

    @media (width <= 768px) {
      body {
        padding: 30px;
      }
    }
  </style>
</head>
<body>

  <div class="demo">
    <div>
      <div class="label">background-clip: border-box</div>
      <div class="box border-box">Фон заходит под рамку</div>
    </div>
    <div>
      <div class="label">background-clip: padding-box</div>
      <div class="box padding-box">Фон не заходит под рамку</div>
    </div>
    <div>
      <div class="label">background-clip: content-box</div>
      <div class="box content-box">Фон только в контенте</div>
    </div>
  </div>
</body>
</html>
