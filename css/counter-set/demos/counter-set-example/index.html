<!DOCTYPE html>
<html lang="ru">

<head>
  <title>Пример использования counter-set — counter-set — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      padding: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #18191C;
      color: #FFFFFF;
      font-family: "Roboto", sans-serif;
    }

    article {
      counter-reset: chapter 0;
    }

    h1 {
      margin-bottom: 17px;
      font-weight: 500;
      font-size: 1.625rem;
    }

    h2 {
      counter-increment: chapter 1;
      margin-top: 40px;
      margin-bottom: 17px;
      font-weight: 500;
      font-size: 1.375rem;
    }

    /* Счётчик сначала вырастет до 4, потом counter-set заменит его на 9 */
    .jump {
      counter-set: chapter 9;
    }

    h2::before {
      content: "Глава " counter(chapter) ": ";
      color: #2E9AFF;
    }

    @media (width <= 768px) {
      body {
        padding: 30px;
      }
    }
  </style>
</head>

<body>
  <article>
    <h1>Учебник по вёрстке</h1>
    <h2>HTML и CSS</h2>
    <h2>Создание стилей и таблиц стилей</h2>
    <h2>Селекторы: выбор форматируемых элементов</h2>
    <h2 class="jump">Механизм наследования стилей</h2>
    <h2>Управление сложной структурой стилей: каскад</h2>
    <h2>Поля, отступы, границы</h2>
  </article>
</body>

</html>
