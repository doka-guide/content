<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Индексы из тегов и из шрифта — font-variant-position — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono&display=swap">
  <style>
    /* В шрифте Libertinus Serif есть OpenType-функции sups и subs */
    @font-face {
      font-family: "Libertinus Serif";
      font-style: normal;
      font-weight: 400;
      font-display: block;
      src: url("LibertinusSerif-subset.woff2") format("woff2");
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      padding: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #18191C;
      color: #FFFFFF;
      font-family: "Roboto", sans-serif;
    }

    code {
      font-family: "Roboto Mono", monospace;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .demo {
      width: 100%;
      max-width: 600px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 30px;
      border: none;
    }

    .control input {
      position: absolute;
      opacity: 0;
    }

    .control span {
      display: block;
      padding: 8px 16px;
      border: 2px solid #282A2E;
      border-radius: 6px;
      background-color: #282A2E;
      font-size: 16px;
      cursor: pointer;
    }

    .control input:checked + span {
      border-color: #2E9AFF;
    }

    .control input:focus-visible + span {
      outline: 2px solid #FFFFFF;
      outline-offset: 2px;
    }

    .text {
      display: grid;
      font-family: "Libertinus Serif", serif;
      font-size: 32px;
      line-height: 1.4;
    }

    /* Оба варианта абзаца лежат в одной ячейке грида: высота блока не меняется при переключении */
    .variant {
      grid-row: 1;
      grid-column: 1;
    }

    .variant-tags :is(sub, sup) {
      color: #F498AD;
    }

    /* Сбрасываем стили тегов и берём глифы из шрифта */
    .variant-font :is(sub, sup) {
      vertical-align: baseline;
      font-size: inherit;
      color: #2E9AFF;
    }

    .variant-font sub {
      font-variant-position: sub;
    }

    .variant-font sup {
      font-variant-position: super;
    }

    /* Показываем вариант, выбранный переключателем */
    .demo:has([value="tags"]:checked) .variant-font,
    .demo:has([value="font"]:checked) .variant-tags {
      visibility: hidden;
    }

    @media (width <= 768px) {
      body {
        padding: 30px;
      }

      .text {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="demo">
    <fieldset class="controls">
      <legend class="visually-hidden">Как нарисовать индексы</legend>
      <label class="control">
        <input type="radio" name="variant" value="tags" checked>
        <span>Теги <code>&lt;sub&gt;</code> и <code>&lt;sup&gt;</code></span>
      </label>
      <label class="control">
        <input type="radio" name="variant" value="font">
        <span>Теги и <code>font-variant-position</code></span>
      </label>
    </fieldset>

    <div class="text">
      <p class="variant variant-tags">
        Вода — это H<sub>2</sub>O, а площадь квадрата — a<sup>2</sup>. Формулу E&nbsp;=&nbsp;mc<sup>2</sup> знают даже те, кто не дочитал до сноски<sup>1</sup>.
      </p>
      <p class="variant variant-font">
        Вода — это H<sub>2</sub>O, а площадь квадрата — a<sup>2</sup>. Формулу E&nbsp;=&nbsp;mc<sup>2</sup> знают даже те, кто не дочитал до сноски<sup>1</sup>.
      </p>
    </div>
  </div>
</body>
</html>
