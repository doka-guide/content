<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Плавность роста шрифта — clamp() — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      padding: 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background-color: #18191C;
      color: #FFFFFF;
      font-family: "Roboto", sans-serif;
      accent-color: #2E9AFF;
    }

    .slider-row {
      width: 100%;
      max-width: 560px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
    }

    input[type="range"] {
      flex: 1;
    }

    .value {
      min-width: 60px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /*
      Настоящий vw в демке не сработает: iframe со статьёй имеет фиксированную
      ширину, реальный viewport не меняется от перетаскивания. Чтобы честно
      показать разницу в скорости роста, используем container query units
      (cqw) — они устроены так же, как vw, но привязаны к ширине .frame,
      которую как раз меняет ползунок.
    */
    .frame {
      container-type: inline-size;
      overflow: hidden;
      border: 1px dashed rgb(255 255 255 / 0.3);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background-color: #282A2E;
      border-radius: 8px;
      padding: 12px 16px;
      min-width: 0;
    }

    .row .top {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .row .label {
      font-size: 12px;
      color: rgb(255 255 255 / 0.6);
      word-break: break-all;
    }

    .row .px {
      font-size: 12px;
      color: #2E9AFF;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .plain {
      font-size: clamp(1rem, 8cqw, 3rem);
      font-weight: 500;
    }

    .calm {
      font-size: clamp(1rem, calc(0.5rem + 4cqw), 3rem);
      font-weight: 500;
    }

    @media (width <= 768px) {
      body {
        padding: 30px;
      }
    }

    .demo-logo {
      display: none;
      position: fixed;
      top: 12px;
      left: 16px;
      color: #FFFFFF;
      font-size: 13px;
      text-decoration: none;
      opacity: 0.7;
      transition: opacity 0.15s;
    }

    .demo-logo:hover {
      opacity: 1;
    }

    .demo-meta {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 8px 20px;
      border-top: 2px solid #2E9AFF;
      background-color: #18191C;
      font-size: 13px;
      font-style: italic;
      justify-content: space-between;
      align-items: center;
    }

    .demo-meta a {
      color: inherit;
      text-decoration-color: #2E9AFF;
      text-decoration-thickness: 2px;
    }
  </style>
</head>
<body>

  <div class="slider-row">
    <span>Ширина блока</span>
    <input type="range" id="width" min="280" max="900" value="280">
    <span class="value" id="value">280px</span>
  </div>

  <div class="frame" id="frame">
    <div class="row">
      <div class="top">
        <span class="plain" id="plain">Aa</span>
        <span class="px" id="plainPx">—</span>
      </div>
      <span class="label">clamp(1rem, 8cqw, 3rem)</span>
    </div>
    <div class="row">
      <div class="top">
        <span class="calm" id="calm">Aa</span>
        <span class="px" id="calmPx">—</span>
      </div>
      <span class="label">clamp(1rem, calc(0.5rem + 4cqw), 3rem)</span>
    </div>
  </div>

  <a class="demo-logo" href="https://doka.guide/">U•ᴥ•U Дока</a>

  <footer class="demo-meta">
    <a href="https://doka.guide/css/clamp/">clamp() — Дока</a>
    <a href="https://doka.guide/people/solarrust/">Алёна Батицкая</a>
  </footer>

  <script>
    const range = document.querySelector('#width')
    const frame = document.querySelector('#frame')
    const value = document.querySelector('#value')
    const plain = document.querySelector('#plain')
    const calm = document.querySelector('#calm')
    const plainPx = document.querySelector('#plainPx')
    const calmPx = document.querySelector('#calmPx')

    const update = () => {
      frame.style.width = range.value + 'px'
      value.textContent = range.value + 'px'

      plainPx.textContent = Math.round(parseFloat(getComputedStyle(plain).fontSize)) + 'px'
      calmPx.textContent = Math.round(parseFloat(getComputedStyle(calm).fontSize)) + 'px'
    }

    range.addEventListener('input', update)
    update()

    if (!new URLSearchParams(window.location.search).has('embed')) {
      document.querySelector('.demo-meta').style.display = 'flex';
      document.querySelector('.demo-logo').style.display = 'block';
    }
  </script>
</body>
</html>
