<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Поля только для чтения — :read-only — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      padding: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #18191C;
      color: #FFFFFF;
      font-family: "Roboto", sans-serif;
    }

    form {
      width: 100%;
      max-width: 480px;
      display: grid;
      gap: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }

    input,
    textarea {
      width: 100%;
      padding: 10px 15px;
      border: 2px solid #FFFFFF;
      border-radius: 6px;
      background-color: #282A2E;
      color: #FFFFFF;
      font: inherit;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input:focus-visible,
    textarea:focus-visible {
      outline: 2px solid #2E9AFF;
      outline-offset: 2px;
    }

    /* Поля только для чтения */
    .field:read-only {
      border-style: dashed;
      border-color: rgb(255 255 255 / 0.4);
      background-color: transparent;
      color: rgb(255 255 255 / 0.7);
    }

    @media (width <= 768px) {
      body {
        padding: 30px;
      }
    }
  </style>
</head>
<body>
  <form>
    <div>
      <label for="order">Номер заказа</label>
      <input class="field" type="text" id="order" value="DK-2026-0042" readonly>
    </div>
    <div>
      <label for="address">Адрес доставки</label>
      <textarea class="field" id="address" readonly>улица Пушкина, дом 1</textarea>
    </div>
    <div>
      <label for="comment">Комментарий к заказу</label>
      <input class="field" type="text" id="comment" placeholder="Напишите, если нужно">
    </div>
  </form>
</body>
</html>
