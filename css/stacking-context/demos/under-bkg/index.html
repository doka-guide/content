<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Родительский контекст наложения — Контекст наложения — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      padding: 50px;
      display: flex;
      flex-direction: column;
      gap: 40px;
      align-items: center;
      justify-content: center;
      background-color: #18191C;
      color: #FFFFFF;
      font-family: "Roboto", sans-serif;
    }

    @media (width <= 768px) {
      body {
        padding: 30px;
      }
    }

    .block {
      position: relative;
      z-index: 1;
      width: 150px;
      height: 150px;
      padding: 15px;
      border: 5px solid;
    }

    .parent {
      background-color: #2E9AFF;
    }

    .child {
      width: 50px;
      height: 50px;
      border: 1px dashed;
      background-color: #663613;
    }

    .red {
      margin-top: -25px;
      margin-left: 25px;
      background-color: #cd445d;
    }

    .yellow {
      position: relative;
      z-index: -9999999;
      margin-top: -25px;
      margin-left: 60px;
      width: 100px;
      background-color: #FFD829;
    }

    /* Родитель без своего контекста наложения */
    .parent.no-context {
      z-index: auto;
    }

    label {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: #2E9AFF;
    }
  </style>
</head>
<body>
  <label>
    <input type="checkbox" checked>
    У родителя <code>z-index: 1</code>
  </label>
  <div class="block parent">
    <div class="child brown"></div>
    <div class="child red"></div>
    <div class="child yellow"></div>
  </div>
  <script>
    const parent = document.querySelector('.parent');

    document.querySelector('input').addEventListener('change', (event) => {
      parent.classList.toggle('no-context', !event.target.checked);
    });
  </script>
</body>
</html>
