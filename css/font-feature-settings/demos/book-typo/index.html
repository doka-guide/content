<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Книжная типографика smcp и onum — font-feature-settings — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    @font-face {
      font-family: "LibertinusSerif";
      src: url("../fonts/LibertinusSerif-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
  </style>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      padding: 40px 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #18191C;
      color: #FFFFFF;
      font-family: "Roboto", sans-serif;
    }

    .demo {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
      max-width: 600px;
    }

    .block {
      background-color: #282A2E;
      border-radius: 8px;
      padding: 20px;
    }

    .block-title {
      font-size: 11px;
      color: rgb(255 255 255 / 0.5);
      margin-bottom: 14px;
      font-family: "Roboto", sans-serif;
    }

    .block-title span {
      color: #2E9AFF;
    }

    .text {
      font-family: "LibertinusSerif", serif;
      font-size: 18px;
      line-height: 1.6;
    }

    .normal {
      font-feature-settings: normal;
    }

    .book {
      font-feature-settings: "smcp", "onum";
    }

    @media (width <= 768px) {
      body {
        padding: 24px 20px;
      }

      .demo {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="demo">
    <div class="block">
      <div class="block-title">normal</div>
      <p class="text normal">
        In 1884, Thomas Edison wrote a letter to Nikola Tesla. On 3 pages he presented 11 arguments. None of them were accepted.
      </p>
    </div>

    <div class="block">
      <div class="block-title"><span>"smcp", "onum"</span></div>
      <p class="text book">
        In 1884, Thomas Edison wrote a letter to Nikola Tesla. On 3 pages he presented 11 arguments. None of them were accepted.
      </p>
    </div>
  </div>
</body>
</html>
