<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Ширина в процентах — font-stretch — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono:wght@400&family=Roboto+Flex:opsz,slnt,wdth,wght,GRAD,XOPQ,XTRA,YOPQ,YTAS,YTDE,YTFI,YTLC,YTUC@8..144,-10..0,25..151,100..1000,-200..150,27..175,323..603,25..135,649..854,-305..-98,560..788,416..570,528..760&display=swap">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      padding: 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      row-gap: 30px;
      background-color: #18191C;
      color: #FFFFFF;
      font-family: "Roboto", sans-serif;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      row-gap: 15px;
      width: 100%;
      max-width: 500px;
    }

    .value {
      font-family: "Roboto Mono", monospace;
      font-size: 24px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #2E9AFF;
    }

    /* Вариативный шрифт: ось wdth от 25 до 151%. Остальные оси Roboto Flex подключены, без них ширина меняется слабо */
    .sample {
      width: 100%;
      max-width: 700px;
      padding: 40px;
      background-color: #282A2E;
      font-family: "Roboto Flex", sans-serif;
      font-size: 32px;
      line-height: 1.3;
      font-stretch: 100%;
    }

    @media (width <= 768px) {
      body {
        padding: 30px;
      }

      .sample {
        padding: 30px;
        font-size: 24px;
      }

      .value {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="controls">
    <label class="value" for="width">font-stretch: <span id="output">100%</span>;</label>
    <input type="range" id="width" min="25" max="151" step="1" value="100">
  </div>
  <p class="sample" id="sample">Съешь же ещё этих мягких французских булок, да выпей чаю</p>

  <script>
    const slider = document.getElementById('width');
    const output = document.getElementById('output');
    const sample = document.getElementById('sample');

    slider.addEventListener('input', () => {
      const value = slider.value + '%';
      sample.style.fontStretch = value;
      output.textContent = value;
    });
  </script>
</body>
</html>
