<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Ключевые слова — font-stretch — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono:wght@400&family=Inconsolata:wdth@50..200&display=swap">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      padding: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #18191C;
      color: #FFFFFF;
      font-family: "Roboto", sans-serif;
    }

    .list {
      display: grid;
      grid-template-columns: max-content 1fr;
      align-items: center;
      column-gap: 30px;
      row-gap: 10px;
      width: 100%;
      max-width: 760px;
    }

    .percent {
      font-family: "Roboto Mono", monospace;
      font-size: 16px;
      color: #F498AD;
      text-align: right;
    }

    /* Название ключевого слова написано этим же ключевым словом */
    .keyword {
      padding: 12px 20px;
      background-color: #282A2E;
      border-left: 4px solid #2E9AFF;
      font-family: "Inconsolata", monospace;
      font-size: 30px;
      white-space: nowrap;
    }

    .ultra-condensed { font-stretch: ultra-condensed; }
    .extra-condensed { font-stretch: extra-condensed; }
    .condensed { font-stretch: condensed; }
    .semi-condensed { font-stretch: semi-condensed; }
    .normal { font-stretch: normal; }
    .semi-expanded { font-stretch: semi-expanded; }
    .expanded { font-stretch: expanded; }
    .extra-expanded { font-stretch: extra-expanded; }
    .ultra-expanded { font-stretch: ultra-expanded; }

    @media (width <= 768px) {
      body {
        padding: 30px 15px;
      }

      .list {
        column-gap: 15px;
      }

      .percent {
        font-size: 14px;
      }

      .keyword {
        padding: 10px 12px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="list">
    <span class="percent">50%</span>
    <span class="keyword ultra-condensed">ultra-condensed</span>
    <span class="percent">62.5%</span>
    <span class="keyword extra-condensed">extra-condensed</span>
    <span class="percent">75%</span>
    <span class="keyword condensed">condensed</span>
    <span class="percent">87.5%</span>
    <span class="keyword semi-condensed">semi-condensed</span>
    <span class="percent">100%</span>
    <span class="keyword normal">normal</span>
    <span class="percent">112.5%</span>
    <span class="keyword semi-expanded">semi-expanded</span>
    <span class="percent">125%</span>
    <span class="keyword expanded">expanded</span>
    <span class="percent">150%</span>
    <span class="keyword extra-expanded">extra-expanded</span>
    <span class="percent">200%</span>
    <span class="keyword ultra-expanded">ultra-expanded</span>
  </div>
</body>
</html>
