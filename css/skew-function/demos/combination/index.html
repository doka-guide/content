<!DOCTYPE html>
<html lang="ru">
<head>
  <title>skew() и цепочка skewX() skewY() — skew() — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono&display=swap">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      padding: 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 70px;
      background-color: #18191C;
      color: #FFFFFF;
      font-family: "Roboto", sans-serif;
    }

    .stage {
      position: relative;
      width: 120px;
      height: 120px;
    }

    .ghost,
    .skew,
    .chain {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
    }

    /* Элемент без искажения */
    .ghost {
      border: 2px dashed rgb(255 255 255 / 0.4);
    }

    /* Оба угла сразу */
    .skew {
      background-color: rgb(46 154 255 / 0.6);
      transform: skew(20deg, 30deg);
    }

    /* Те же углы по очереди */
    .chain {
      border: 3px solid #F498AD;
      transform: skewX(20deg) skewY(30deg);
    }

    .chain.reversed {
      transform: skewY(30deg) skewX(20deg);
    }

    .legend {
      display: grid;
      gap: 10px;
      font-family: "Roboto Mono", monospace;
      font-size: 14px;
    }

    .legend span {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 10px;
      vertical-align: middle;
    }

    .legend-skew {
      background-color: rgb(46 154 255 / 0.6);
    }

    .legend-chain {
      border: 3px solid #F498AD;
    }

    button {
      padding: 10px 20px;
      border: 2px solid #2E9AFF;
      border-radius: 6px;
      background-color: #282A2E;
      color: #FFFFFF;
      font: inherit;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible {
      background-color: #2E9AFF;
      color: #000000;
    }

    @media (width <= 768px) {
      body {
        padding: 30px;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="ghost"></div>
    <div class="skew"></div>
    <div class="chain"></div>
  </div>

  <div class="legend">
    <div><span class="legend-skew"></span>skew(20deg, 30deg)</div>
    <div><span class="legend-chain"></span><code class="chain-code" aria-live="polite">skewX(20deg) skewY(30deg)</code></div>
  </div>

  <button type="button">Поменять порядок в цепочке</button>

  <script>
    const chain = document.querySelector('.chain');
    const chainCode = document.querySelector('.chain-code');
    const button = document.querySelector('button');

    button.addEventListener('click', () => {
      chain.classList.toggle('reversed');
      chainCode.textContent = chain.classList.contains('reversed')
        ? 'skewY(30deg) skewX(20deg)'
        : 'skewX(20deg) skewY(30deg)';
    });
  </script>
</body>
</html>
