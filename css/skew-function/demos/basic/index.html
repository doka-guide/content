<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Углы наклона — skew() — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono&display=swap">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      padding: 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 70px;
      background-color: #18191C;
      color: #FFFFFF;
      font-family: "Roboto", sans-serif;
    }

    .stage {
      position: relative;
      width: 120px;
      height: 120px;
    }

    /* Контур элемента без искажения */
    .ghost,
    .box {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
    }

    .ghost {
      border: 2px dashed rgb(255 255 255 / 0.4);
    }

    .box {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #2E9AFF;
      font-size: 24px;
      font-weight: 500;
      transform: skew(var(--x), var(--y));
    }

    .controls {
      display: grid;
      grid-template-columns: auto 200px 60px;
      align-items: center;
      gap: 10px 15px;
    }

    label {
      white-space: nowrap;
    }

    input[type="range"] {
      accent-color: #2E9AFF;
    }

    output,
    code {
      font-family: "Roboto Mono", monospace;
    }

    code {
      color: #F498AD;
      font-size: 14px;
      white-space: nowrap;
    }

    @media (width <= 768px) {
      body {
        padding: 30px;
      }

      .controls {
        grid-template-columns: auto 1fr 60px;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="ghost"></div>
    <div class="box" style="--x: 20deg; --y: 0deg">Текст</div>
  </div>

  <div class="controls">
    <label for="x">По оси x</label>
    <input id="x" type="range" min="-40" max="40" value="20">
    <output for="x">20deg</output>

    <label for="y">По оси y</label>
    <input id="y" type="range" min="-40" max="40" value="0">
    <output for="y">0deg</output>
  </div>

  <code>transform: skew(20deg, 0deg);</code>

  <script>
    const box = document.querySelector('.box');
    const code = document.querySelector('code');
    const x = document.getElementById('x');
    const y = document.getElementById('y');

    function update() {
      box.style.setProperty('--x', `${x.value}deg`);
      box.style.setProperty('--y', `${y.value}deg`);
      x.nextElementSibling.textContent = `${x.value}deg`;
      y.nextElementSibling.textContent = `${y.value}deg`;
      code.textContent = `transform: skew(${x.value}deg, ${y.value}deg);`;
    }

    x.addEventListener('input', update);
    y.addEventListener('input', update);
  </script>
</body>
</html>
