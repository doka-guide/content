<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Относительное значение — color() — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      padding: 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background-color: #18191C;
      color: #000000;
      font-family: "Roboto", sans-serif;
    }

    .wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .color {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 200px;
      padding: 20px;
      text-align: center;
      aspect-ratio: 1 / 1;
    }

    .color-text {
      font-size: 18px;
    }

    .keyword {
      background-color: hotpink;
    }

    .display-p3 {
      background-color: color(from hotpink display-p3 r g b / 0.8);
    }

    .a98 {
      background-color: color(from hotpink a98-rgb r 1 0 / 0.8);
    }

    .dark {
      color: #FFFFFF;
      background-color: color(from hotpink srgb calc(r * 0.6) calc(g * 0.6) calc(b * 0.6));
    }

    @media (width <= 1000px) {
      .color {
        width: 150px;
        padding: 10px;
      }
    }

    @media (width <= 768px) {
      body {
        padding: 30px;
        gap: 10px;
      }

      .wrapper {
        width: 310px;
        gap: 10px;
      }

      .color {
        aspect-ratio: 3 / 2;
      }
    }

    @media (width <= 480px) {
      .color {
        width: 135px;
        aspect-ratio: 4 / 3;
      }

      .color-text {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="color keyword">
      <span class="color-text">hotpink</span>
    </div>
    <div class="color display-p3">
      <span class="color-text">Display P3 / 0.8</span>
    </div>
    <div class="color a98">
      <span class="color-text">a98-rgb r 1 0 / 0.8</span>
    </div>
    <div class="color dark">
      <span class="color-text">srgb × 0.6</span>
    </div>
  </div>
</body>
</html>
