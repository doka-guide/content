<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Display P3 — color() — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      padding: 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background-color: #18191C;
      color: #FFFFFF;
      font-family: "Roboto", sans-serif;
    }

    .compare {
      --split: 50%;
      position: relative;
      width: 100%;
      max-width: 560px;
      height: 240px;
      touch-action: none;
      cursor: ew-resize;
      user-select: none;
    }

    .layer {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      display: grid;
      grid-template-rows: repeat(3, 1fr);
    }

    /* Слева — цвета Display P3, справа — похожие цвета из sRGB */
    .layer-p3 {
      clip-path: inset(0 calc(100% - var(--split)) 0 0);
    }

    .layer-hex {
      clip-path: inset(0 0 0 var(--split));
    }

    .layer-p3 .red {
      background-color: color(display-p3 1 0 0);
    }

    .layer-p3 .green {
      background-color: color(display-p3 0 1 0);
    }

    .layer-p3 .blue {
      background-color: color(display-p3 0 0.72 1);
    }

    .layer-hex .red {
      background-color: #FF0000;
    }

    .layer-hex .green {
      background-color: #00FF00;
    }

    .layer-hex .blue {
      background-color: #00BBFF;
    }

    .label {
      position: absolute;
      top: 10px;
      padding: 4px 8px;
      background-color: #18191C;
      font-size: 14px;
      font-weight: 500;
    }

    .label-p3 {
      left: 10px;
    }

    .label-hex {
      right: 10px;
    }

    .divider {
      position: absolute;
      top: 0;
      bottom: 0;
      left: var(--split);
      width: 2px;
      background-color: #FFFFFF;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .divider::after {
      content: "↔";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #FFFFFF;
      border-radius: 50%;
      background-color: #18191C;
      font-size: 16px;
      transform: translate(-50%, -50%);
    }

    .note {
      max-width: 560px;
      font-size: 16px;
      text-align: center;
    }

    .note-p3 {
      display: none;
    }

    /* Экран умеет показывать P3 — меняем подсказку */
    @media (color-gamut: p3) {
      .note-p3 {
        display: block;
      }

      .note-srgb {
        display: none;
      }
    }

    @media (width <= 768px) {
      body {
        padding: 30px;
      }

      .compare {
        height: 180px;
      }
    }
  </style>
</head>
<body>
  <div class="compare">
    <div class="layer layer-hex">
      <div class="red"></div>
      <div class="green"></div>
      <div class="blue"></div>
    </div>
    <div class="layer layer-p3">
      <div class="red"></div>
      <div class="green"></div>
      <div class="blue"></div>
    </div>
    <span class="label label-p3">display-p3</span>
    <span class="label label-hex">HEX</span>
    <div class="divider"></div>
  </div>
  <p class="note note-p3">Двигайте разделитель: слева цвета Display P3, справа — цвета #FF0000, #00FF00 и #00BBFF из sRGB.</p>
  <p class="note note-srgb">Ваш экран не показывает цвета Display P3, поэтому обе половины выглядят одинаково 😢</p>

  <script>
    const compare = document.querySelector('.compare');

    function moveSplit(event) {
      const rect = compare.getBoundingClientRect();
      const x = Math.min(Math.max(event.clientX - rect.left, 0), rect.width);
      compare.style.setProperty('--split', `${(x / rect.width) * 100}%`);
    }

    compare.addEventListener('pointerdown', (event) => {
      compare.setPointerCapture(event.pointerId);
      moveSplit(event);
    });

    compare.addEventListener('pointermove', (event) => {
      if (compare.hasPointerCapture(event.pointerId)) {
        moveSplit(event);
      }
    });
  </script>
</body>
</html>
