<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Абсолютное значение — color() — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      padding: 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background-color: #18191C;
      color: #000000;
      font-family: "Roboto", sans-serif;
    }

    body::after {
      content: 'Ваш экран не показывает цвета Display P3, поэтому блоки Display P3, a98-rgb и HEX выглядят одинаково 😢';
      display: block;
      color: #FFFFFF;
      font-size: 18px;
      text-align: center;
    }

    @media (color-gamut: p3) {
      body::after {
        display: none;
      }
    }

    .container {
      display: flex;
      gap: 20px;
      flex-direction: column;
    }

    .wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .color {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 200px;
      padding: 20px;
      text-align: center;
      aspect-ratio: 1 / 1;
    }

    .color-text {
      font-size: 18px;
    }

    .display-p3 {
      background-color: color(display-p3 0 0.72 1);
    }

    .a98 {
      background-color: color(a98-rgb 0.29 0.73 1);
    }

    .linear {
      background-color: color(srgb-linear 0 0.5 1);
    }

    .hex {
      background-color: #00bbff;
    }

    .alpha .display-p3 {
      background-color: color(display-p3 0 0.72 1 / 0.5);
    }

    .alpha .a98 {
      background-color: color(a98-rgb 0.29 0.73 1 / 0.5);
    }

    .alpha .linear {
      background-color: color(srgb-linear 0 0.5 1 / 0.5);
    }

    @media (width <= 1000px) {
      .color {
        width: 150px;
        padding: 10px;
      }
    }

    @media (width <= 768px) {
      body {
        padding: 30px;
        gap: 10px;
      }

      body::after {
        width: 280px;
      }

      .container {
        flex-direction: row;
        gap: 10px;
      }

      .wrapper {
        flex-direction: row;
        width: min-content;
        gap: 10px;
      }

      .color {
        aspect-ratio: 3 / 2;
      }
    }

    @media (width <= 480px) {
      .color {
        width: 135px;
        aspect-ratio: 4 / 3;
      }

      .color-text {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="wrapper">
      <div class="color display-p3">
        <span class="color-text">Display P3</span>
      </div>
      <div class="color a98">
        <span class="color-text">a98-rgb</span>
      </div>
      <div class="color linear">
        <span class="color-text">srgb-linear</span>
      </div>
      <div class="color hex">
        <span class="color-text">HEX</span>
      </div>
    </div>
    <div class="wrapper alpha">
      <div class="color display-p3">
        <span class="color-text">Display P3 / 0.5</span>
      </div>
      <div class="color a98">
        <span class="color-text">a98-rgb / 0.5</span>
      </div>
      <div class="color linear">
        <span class="color-text">srgb-linear / 0.5</span>
      </div>
      <div class="color hex">
        <span class="color-text">HEX без альфа-канала</span>
      </div>
    </div>
  </div>
</body>
</html>
