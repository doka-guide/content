<!DOCTYPE html>
<html lang="ru">
<head>
  <title>::selection в сочетании с text-shadow — ::selection — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      padding: 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background-color: #18191C;
      color: #FFFFFF;
      font-family: "Roboto", sans-serif;
      text-align: center;
    }

    p {
      font-size: 2rem;
      font-weight: 500;
    }

    p::selection {
      --color-shadow: #000000;
      color: #FFFFFF;
      background-color: #0066CC;
      text-shadow:
        1px 0 1px var(--color-shadow),
        0 1px 1px var(--color-shadow),
        2px 1px 1px var(--color-shadow),
        1px 2px 1px var(--color-shadow),
        3px 2px 1px var(--color-shadow),
        2px 3px 1px var(--color-shadow);
    }

    .prompt {
      color: #C5C5C5;
    }

    @media (width <= 768px) {
      body {
        padding: 30px;
      }
    }
  </style>
</head>
<body>
  <p>Выделите этот текст</p>
  <span class="prompt">Выделенный текст станет объёмным</span>
</body>
</html>
