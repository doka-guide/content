<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Плавное появление и исчезновение через display — display — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    /* Тестовая правка для проверки превью */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      padding: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #18191C;
      color: #FFFFFF;
      font-family: "Roboto", sans-serif;
    }

    /* === стили демо === */

    .wrapper {
      width: 100%;
      max-width: 460px;
      min-height: 200px;
      text-align: center;
    }

    .toggle {
      padding: 12px 24px;
      border: 2px solid #2E9AFF;
      border-radius: 8px;
      background-color: #2E9AFF;
      color: #000000;
      font-family: inherit;
      font-size: 18px;
      font-weight: 500;
      cursor: pointer;
    }

    .toggle:focus-visible {
      outline: 2px solid #FFFFFF;
      outline-offset: 3px;
    }

    .note {
      margin-top: 24px;
      padding: 40px 30px;
      display: none;
      background-color: #F498AD;
      color: #000000;
      font-size: 24px;
      line-height: 1.4;
      opacity: 0;
      /* display переключится в none только после того, как доиграет opacity */
      transition:
        opacity 0.35s,
        display 0.35s allow-discrete;
    }

    .note.is-open {
      display: block;
      opacity: 1;
    }

    /* С этого состояния начинается появление из display: none */
    @starting-style {
      .note.is-open {
        opacity: 0;
      }
    }

    @media (width <= 768px) {
      body {
        padding: 30px;
      }

      .note {
        padding: 30px 20px;
        font-size: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <button class="toggle" type="button" aria-expanded="false" aria-controls="note">
      Показать подсказку
    </button>
    <p class="note" id="note">Теперь ты читаешь скрытую подсказку! 🎉</p>
  </div>

  <script>
    const button = document.querySelector('.toggle')
    const note = document.querySelector('.note')

    button.addEventListener('click', () => {
      const isOpen = note.classList.toggle('is-open')
      button.setAttribute('aria-expanded', isOpen)
      button.textContent = isOpen ? 'Спрятать подсказку' : 'Показать подсказку'
    })
  </script>
</body>
</html>
