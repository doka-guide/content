<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Список без маркера — list-style-type — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #18191C;
      color: #FFFFFF;
      font-family: "Roboto", sans-serif;
    }

    ul {
      font-size: 20px;
      font-weight: 400;
      list-style-type: none;
      text-align: center;
    }

    li + li {
      margin-top: 15px;
    }

    a {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 24px;
      color: #FFFFFF;
      text-decoration-color: #2E9AFF;
      text-decoration-thickness: 2px;
      transition: background-color 0.2s linear;
    }

    a:hover {
      background-color: #2E9AFF;
      color: #18191C;
    }

    a:focus-visible {
      outline: 2px solid #2E9AFF;
      outline-offset: 2px;
    }

    @media (width <= 768px) {
      body {
        padding: 30px;
      }
    }
  </style>
</head>
<body>
  <nav>
    <ul>
      <li>
        <a href="#">Статьи</a>
      </li>
      <li>
        <a href="#">Авторы</a>
      </li>
      <li>
        <a href="#">Контакты</a>
      </li>
    </ul>
  </nav>
</body>
</html>
