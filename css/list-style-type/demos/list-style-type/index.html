<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Варианты — list-style-type — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      padding: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #18191C;
      color: #FFFFFF;
      font-family: "Roboto", sans-serif;
    }

    .demo {
      width: 100%;
      max-width: 720px;
    }

    .code {
      padding: 12px 16px;
      background-color: #282A2E;
      border-radius: 4px;
      color: #2E9AFF;
      font-size: 16px;
      white-space: pre-wrap;
    }

    .preview {
      display: flex;
      align-items: flex-start;
      gap: 40px;
      margin-top: 24px;
    }

    .sample {
      flex-shrink: 0;
      padding-left: 40px;
      font-size: 20px;
      line-height: 1.5;
    }

    .hint {
      min-height: 3em;
      color: #F498AD;
      font-size: 16px;
      line-height: 1.5;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 24px;
    }

    .button {
      min-height: 32px;
      padding: 6px 10px;
      border: 1px solid transparent;
      border-radius: 4px;
      background-color: #282A2E;
      color: #FFFFFF;
      font-family: monospace;
      font-size: 14px;
      cursor: pointer;
    }

    .button:hover {
      border-color: rgb(255 255 255 / 0.4);
    }

    .button:focus-visible {
      outline: 2px solid #2E9AFF;
      outline-offset: 2px;
    }

    .button[aria-pressed="true"] {
      border-color: #2E9AFF;
      background-color: #2E9AFF;
      color: #18191C;
    }

    @media (width <= 768px) {
      body {
        padding: 30px;
      }

      .preview {
        flex-direction: column;
        gap: 12px;
      }

      .sample {
        font-size: 18px;
      }

      .button {
        padding: 4px 8px;
      }
    }
  </style>
</head>
<body>
  <div class="demo">
    <pre class="code"><code>ul { list-style-type: disc; }</code></pre>
    <div class="preview">
      <ul class="sample">
        <li>Первый пункт</li>
        <li>Второй пункт</li>
        <li>Третий пункт</li>
      </ul>
      <p class="hint" aria-live="polite"></p>
    </div>
    <div class="controls" role="group" aria-label="Значение list-style-type"></div>
  </div>

  <script>
    // Значение и пояснение к нему
    const VALUES = [
      ['disc', 'маркер в виде точки, по умолчанию у <ul>'],
      ['circle', 'маркер в виде кружка'],
      ['square', 'маркер в виде квадрата'],
      ['disclosure-open', 'треугольник открытого <details>'],
      ['disclosure-closed', 'треугольник закрытого <details>'],
      ['decimal', 'арабские цифры, по умолчанию у <ol>'],
      ['decimal-leading-zero', 'цифры с нулём впереди: 01, 02, 03'],
      ['lower-roman', 'строчные римские цифры'],
      ['upper-roman', 'заглавные римские цифры'],
      ['lower-alpha', 'строчные латинские буквы'],
      ['upper-alpha', 'заглавные латинские буквы'],
      ['lower-greek', 'строчные греческие буквы'],
      ['lower-armenian', 'строчная армянская нумерация'],
      ['georgian', 'традиционные грузинские цифры'],
      ['cjk-decimal', 'китайские десятичные цифры'],
      ['hiragana', 'японская азбука хирагана'],
      ['"→ "', 'строка в кавычках вместо маркера'],
      [
        'symbols(cyclic "◆" "◇")',
        'свой набор маркеров прямо в значении',
      ],
      ['none', 'без маркера'],
    ];

    const code = document.querySelector('.code code');
    const sample = document.querySelector('.sample');
    const hint = document.querySelector('.hint');
    const controls = document.querySelector('.controls');

    const buttons = VALUES.map(([value, text]) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'button';
      button.textContent = value;
      button.addEventListener('click', () => {
        select(button, value, text);
      });
      controls.append(button);
      return button;
    });

    function select(current, value, text) {
      buttons.forEach((button) => {
        button.setAttribute('aria-pressed', button === current);
      });
      code.textContent = `ul { list-style-type: ${value}; }`;

      if (CSS.supports('list-style-type', value)) {
        sample.style.listStyleType = value;
        hint.textContent = text;
      } else {
        sample.style.listStyleType = '';
        hint.textContent = 'Этот браузер пока не понимает значение, ' +
          'поэтому показывает маркер по умолчанию';
      }
    }

    select(buttons[0], ...VALUES[0]);
  </script>
</body>
</html>
