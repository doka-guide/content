<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Список задач на :has() — :has() — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      padding: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #18191C;
      color: #FFFFFF;
      font-family: "Roboto", sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      border: 2px solid #282A2E;
      border-radius: 12px;
      transition: border-color 0.3s;
    }

    .title {
      margin-bottom: 16px;
      font-size: 20px;
      font-weight: 500;
    }

    .list {
      list-style: none;
    }

    .task {
      margin-bottom: 8px;
      border-radius: 8px;
      background-color: #282A2E;
      transition: opacity 0.3s;
    }

    .task label {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      cursor: pointer;
    }

    .task input {
      width: 20px;
      height: 20px;
      accent-color: #2E9AFF;
      cursor: pointer;
    }

    .done {
      display: none;
      margin-top: 16px;
      color: #F498AD;
      font-weight: 500;
    }

    /* Задача с отмеченным чекбоксом */
    .task:has(:checked) {
      opacity: 0.5;
    }

    .task:has(:checked) span {
      text-decoration: line-through;
    }

    /* В карточке не осталось ни одного неотмеченного чекбокса */
    .card:not(:has(input:not(:checked))) {
      border-color: #2E9AFF;
    }

    .card:not(:has(input:not(:checked))) .done {
      display: block;
    }

    @media (width <= 768px) {
      body {
        padding: 30px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="title">Планы на вечер</h1>
    <ul class="list">
      <li class="task">
        <label>
          <input type="checkbox" checked>
          <span>Прочитать про :has()</span>
        </label>
      </li>
      <li class="task">
        <label>
          <input type="checkbox">
          <span>Выбрать родителя без JavaScript</span>
        </label>
      </li>
      <li class="task">
        <label>
          <input type="checkbox">
          <span>Похвастаться коллегам</span>
        </label>
      </li>
    </ul>
    <p class="done">Всё готово, можно отдыхать!</p>
  </div>
</body>
</html>
