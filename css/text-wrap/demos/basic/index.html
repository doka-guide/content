<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Значения text-wrap — text-wrap — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono&display=swap">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      padding: 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 25px;
      background-color: #18191C;
      color: #FFFFFF;
      font-family: "Roboto", sans-serif;
    }

    fieldset {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 25px;
      border: none;
    }

    legend {
      margin-bottom: 10px;
    }

    label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    input {
      accent-color: #2E9AFF;
    }

    .width {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    code,
    output {
      font-family: "Roboto Mono", monospace;
    }

    .box {
      width: var(--width, 420px);
      max-width: 100%;
      overflow: auto;
      padding: 20px;
      border: 2px dashed #2E9AFF;
    }

    .title {
      font-size: 28px;
      font-weight: 500;
      line-height: 1.3;
      text-wrap: var(--wrap, wrap);
    }

    @media (width <= 768px) {
      body {
        padding: 30px;
      }
    }
  </style>
</head>
<body>
  <fieldset>
    <legend>Значение <code>text-wrap</code></legend>
    <label><input type="radio" name="wrap" value="wrap" checked> <code>wrap</code></label>
    <label><input type="radio" name="wrap" value="nowrap"> <code>nowrap</code></label>
    <label><input type="radio" name="wrap" value="balance"> <code>balance</code></label>
    <label><input type="radio" name="wrap" value="pretty"> <code>pretty</code></label>
  </fieldset>

  <div class="width">
    <label for="width">Ширина блока</label>
    <input id="width" type="range" min="280" max="600" value="420">
    <output for="width">420px</output>
  </div>

  <div class="box">
    <h1 class="title">Как сверстать заголовок, который аккуратно переносится на любом экране</h1>
  </div>

  <script>
    const box = document.querySelector('.box');
    const title = document.querySelector('.title');
    const width = document.getElementById('width');

    document.querySelectorAll('input[name="wrap"]').forEach((radio) => {
      radio.addEventListener('change', () => {
        title.style.setProperty('--wrap', radio.value);
      });
    });

    width.addEventListener('input', () => {
      box.style.setProperty('--width', `${width.value}px`);
      width.nextElementSibling.textContent = `${width.value}px`;
    });
  </script>
</body>
</html>
