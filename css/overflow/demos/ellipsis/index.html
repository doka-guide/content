<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Многоточие — overflow — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      padding: 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background-color: #18191C;
      color: #FFFFFF;
      font-family: "Roboto", sans-serif;
      font-size: 20px;
      line-height: 1.4;
    }

    .truncate,
    .clamp {
      width: 250px;
      /* Без отступа снизу: иначе в нём видна третья строка */
      padding: 0 8px;
      border: 2px solid #2E9AFF;
      overflow: hidden;
    }

    /* Одна строка */
    .truncate {
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    /* Несколько строк */
    .clamp {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    @media (width <= 768px) {
      body {
        padding: 30px;
      }
    }
  </style>
</head>
<body>
  <p class="truncate">
    Однажды, в студёную зимнюю пору
  </p>
  <p class="clamp">
    Однажды, в студёную зимнюю пору я из лесу вышел; был сильный мороз
  </p>
</body>
</html>
