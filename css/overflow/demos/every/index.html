<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Разные виды скрытия — overflow — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      padding: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #18191C;
      color: #FFFFFF;
      font-family: "Roboto", sans-serif;
    }

    /* Кнопки слева, блок с текстом справа */
    .demo {
      display: flex;
      align-items: flex-start;
      gap: 32px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    button {
      padding: 8px 12px;
      border: 2px solid transparent;
      border-radius: 6px;
      background-color: #282A2E;
      color: #FFFFFF;
      font-size: 16px;
      text-align: left;
      cursor: pointer;
    }

    button[aria-pressed="true"] {
      border-color: #2E9AFF;
    }

    /* Текст не помещается в блок по высоте */
    .text {
      width: 220px;
      height: 120px;
      padding: 8px;
      border: 2px solid #2E9AFF;
      font-size: 16px;
      line-height: 1.4;
    }

    @media (width <= 768px) {
      body {
        padding: 30px;
      }

      .demo {
        gap: 16px;
      }

      button {
        font-size: 14px;
      }

      .text {
        width: 150px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="demo">
    <div class="buttons">
      <button type="button" data-value="visible" aria-pressed="true">
        <code>visible</code>
      </button>
      <button type="button" data-value="hidden" aria-pressed="false">
        <code>hidden</code>
      </button>
      <button type="button" data-value="clip" aria-pressed="false">
        <code>clip</code>
      </button>
      <button type="button" data-value="scroll" aria-pressed="false">
        <code>scroll</code>
      </button>
      <button type="button" data-value="auto" aria-pressed="false">
        <code>auto</code>
      </button>
    </div>
    <p class="text">
      Однажды, в студёную зимнюю пору я из лесу вышел; был сильный
      мороз. Гляжу, поднимается медленно в гору лошадка, везущая
      хворосту воз.
    </p>
  </div>

  <script>
    const textBlock = document.querySelector('.text');
    const buttons = document.querySelectorAll('button');

    buttons.forEach((button) => {
      button.addEventListener('click', () => {
        buttons.forEach((el) => {
          el.setAttribute('aria-pressed', 'false');
        });
        button.setAttribute('aria-pressed', 'true');
        textBlock.style.overflow = button.dataset.value;
      });
    });
  </script>
</body>
</html>
