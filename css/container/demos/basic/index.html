<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Контейнерные запросы в гриде — @container — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      padding: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #18191C;
      color: #FFFFFF;
      font-family: "Roboto", sans-serif;
    }

    @media (width <= 768px) {
      body {
        padding: 30px;
      }
    }

    /* === демо === */

    .demo {
      width: 100%;
      max-width: 860px;
    }

    .controls {
      margin-bottom: 20px;
    }

    .controls__label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      font-size: 15px;
      color: #C8CDD4;
    }

    .controls__status {
      color: #2E9AFF;
      font-variant-numeric: tabular-nums;
    }

    .controls__range {
      width: 100%;
      accent-color: #2E9AFF;
    }

    /* Контейнер: его ширину меняет ползунок */
    .catalog {
      container-type: inline-size;
      width: var(--catalog-width, 100%);
      max-width: 100%;
      padding: 16px;
      border: 2px solid #2E9AFF;
      border-radius: 12px;
      background-color: #1E2024;
    }

    .cards {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(3, 1fr);
    }

    .card {
      padding: 16px;
      border: 1px solid #2E3138;
      border-radius: 10px;
      background-color: #282A2E;
      color: #C8CDD4;
      text-align: center;
    }

    /* Меняем сетку по ширине контейнера .catalog, а не окна */
    @container (max-width: 600px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @container (max-width: 380px) {
      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="demo">
    <div class="controls">
      <label class="controls__label" for="width">
        <span>Двигайте ползунок, чтобы изменить ширину контейнера</span>
        <span class="controls__status" aria-live="polite"></span>
      </label>
      <input class="controls__range" id="width" type="range" min="240" max="860" step="10" value="860">
    </div>

    <section class="catalog">
      <div class="cards">
        <article class="card">1</article>
        <article class="card">2</article>
        <article class="card">3</article>
        <article class="card">4</article>
        <article class="card">5</article>
        <article class="card">6</article>
      </div>
    </section>
  </div>

  <script>
    const range = document.querySelector('.controls__range');
    const output = document.querySelector('.controls__status');
    const catalog = document.querySelector('.catalog');
    const cards = document.querySelector('.cards');

    function update() {
      catalog.style.setProperty('--catalog-width', `${range.value}px`);
      const columns = getComputedStyle(cards).gridTemplateColumns.split(' ').length;
      output.textContent = `${catalog.offsetWidth}px, колонок: ${columns}`;
    }

    range.addEventListener('input', update);
    window.addEventListener('resize', update);
    update();
  </script>
</body>
</html>
