<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Плавное появление — visibility — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;1,300&amp;display=swap">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      color-scheme: dark;
      block-size: 100%;
    }

    body {
      display: grid;
      place-items: center;
      padding: 5%;
      background-color: #18191C;
      color: #FFFFFF;
      font-family: "Roboto", sans-serif;
      font-size: 24px;
      font-weight: 300;
      text-align: center;
    }

    .card {
      padding: 15px;
      border: 1px solid #2E9AFF;
    }

    button {
      margin-block-end: 15px;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background-color: #282A2E;
      color: #FFFFFF;
      font: inherit;
    }

    .card-hint {
      visibility: hidden;
      opacity: 0;
      transition: opacity 300ms, visibility 300ms;
    }

    .card:hover .card-hint,
    .card:focus-within .card-hint {
      visibility: visible;
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="card">
    <button type="button" aria-describedby="hint">
      Наведи или нажми Tab
    </button>
    <div class="card-hint" id="hint">
      Я появляюсь, когда кнопка в фокусе или курсор над карточкой.
    </div>
  </div>
</body>
</html>
