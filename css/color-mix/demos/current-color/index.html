<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Смешивание с currentColor — color-mix() — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono&display=swap">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      padding: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #18191C;
      color: #FFFFFF;
      font-family: "Roboto", sans-serif;
    }

    .wrapper {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Один класс на все плашки: фон и рамка берут цвет текста */
    .note {
      padding: 16px 20px;
      border: 2px solid color-mix(in oklab, currentColor 50%, transparent);
      border-radius: 8px;
      background-color: color-mix(in oklab, currentColor 15%, transparent);
      font-size: 18px;
      line-height: 1.4;
    }

    .note--blue {
      color: #2E9AFF;
    }

    .note--pink {
      color: #F498AD;
    }

    .note--custom {
      color: var(--custom-color, #FFD829);
    }

    .picker {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 16px;
    }

    .picker input {
      width: 48px;
      height: 32px;
      border: none;
      border-radius: 4px;
      background-color: #282A2E;
      cursor: pointer;
    }

    .code {
      padding: 12px 16px;
      border-radius: 8px;
      background-color: #282A2E;
      font-family: "Roboto Mono", monospace;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    @media (width <= 768px) {
      body {
        padding: 30px;
      }

      .wrapper {
        gap: 12px;
      }

      .note {
        padding: 12px 16px;
        font-size: 16px;
      }

      .code {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <p class="note note--blue">У плашки меняется только цвет текста</p>
    <p class="note note--pink">Фон и рамка подстраиваются сами</p>
    <p class="note note--custom" id="custom-note">Выберите цвет этой плашки</p>

    <label class="picker">
      <input type="color" id="color-picker" value="#FFD829">
      Цвет текста третьей плашки
    </label>

    <pre class="code">.note {
  border: 2px solid color-mix(in oklab, currentColor 50%, transparent);
  background-color: color-mix(in oklab, currentColor 15%, transparent);
}</pre>
  </div>

  <script>
    const picker = document.getElementById('color-picker');
    const customNote = document.getElementById('custom-note');

    // Меняем только color — color-mix() пересчитает фон и рамку
    picker.addEventListener('input', () => {
      customNote.style.setProperty('--custom-color', picker.value);
    });
  </script>
</body>
</html>
