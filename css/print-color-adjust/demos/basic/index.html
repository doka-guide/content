<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Пример работы свойства print-color-adjust — print-color-adjust — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      padding: 50px;
      font-size: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #18191C;
      color: #FFFFFF;
      font-family: "Roboto", sans-serif;
    }

    @media (width <= 768px) {
      body {
        padding: 30px;
        font-size: 18px;
      }
    }

    .container {
      display: grid;
      gap: 1rem;
      grid-template-columns: 1fr 1fr;
    }

    .print {
      grid-column: 1 / -1;
      justify-self: center;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background-color: #282A2E;
      color: #FFFFFF;
      font: inherit;
      font-size: 18px;
      cursor: pointer;
    }

    .print:hover {
      background-color: #2E9AFF;
    }

    /* Кнопку не печатаем */
    @media print {
      .print {
        display: none;
      }
    }

    .keep-color, .economy-color {
      min-height: 120px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .keep-color {
      background: #FF8630;
      color: #000000;
      /* Префикс для старых Chrome, Edge и Safari */
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .economy-color {
      background: #2E9AFF;
      color: #000000;
      print-color-adjust: economy;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="keep-color">Цвет останется при печати</div>
    <div class="economy-color">Цвет может измениться при печати</div>
    <button class="print" type="button">Открыть предпросмотр печати</button>
  </div>

  <script>
    document.querySelector('.print').addEventListener('click', () => {
      window.print();
    });
  </script>
</body>
</html>
