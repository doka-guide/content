<!DOCTYPE html>
<html lang="ru">
<head>
  <title>PDF внутри object — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto&display=swap">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      padding: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #18191C;
      color: #FFFFFF;
      font-size: 18px;
      font-family: "Roboto", sans-serif;
    }

    a {
      border-radius: 3px;
      color: inherit;
      text-decoration-color: #FF8630;
      text-decoration-thickness: 2px;
      transition: background-color 0.2s linear;
    }

    a:hover {
      background-color: #FF8630;
    }

    a:focus-visible {
      outline: 2px solid #FF8630;
      outline-offset: 2px;
    }

    object {
      max-width: 100%;
    }

    p {
      margin-top: 20px;
    }

    @media (width <= 768px) {
      body {
        padding: 30px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <object type="application/pdf" data="example.pdf" width="600" height="700" title="Ноты «Лунной сонаты»">
      <p>Не получилось показать ноты в браузере.</p>
    </object>
    <p><a href="example.pdf">Скачать ноты в PDF</a></p>
  </div>
</body>
</html>
