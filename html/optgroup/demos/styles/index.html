<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Стилизация optgroup — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      padding: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 50px;
      background-color: #18191C;
      color: #FFFFFF;
      font-family: "Roboto", sans-serif;
      font-size: 18px;
    }

    label {
      font-size: 24px;
      font-weight: 500;
      line-height: 1;
    }

    select {
      width: 300px;
      padding: 10px 15px;
      font: inherit;
    }

    optgroup {
      color: #FF8630;
      background-color: #000000;
    }

    /* Настраиваемый select: Chrome и Edge с версии 135, Safari с версии 27 */
    select,
    ::picker(select) {
      appearance: base-select;
    }

    ::picker(select) {
      border: 2px solid #FF8630;
      border-radius: 6px;
      background-color: #000000;
    }

    optgroup legend {
      padding: 6px 15px;
      font-weight: 500;
      text-transform: uppercase;
    }

    option {
      padding: 6px 15px 6px 30px;
      color: #FFFFFF;
    }

    option:hover,
    option:focus-visible {
      color: #000000;
      background-color: #FF8630;
    }

    @media (width <= 768px) {
      body {
        padding: 30px;
        flex-direction: column;
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <label for="colors">Выберите оттенок:</label>
  <select id="colors">
    <optgroup label="Оранжевые">
      <legend>Оранжевые</legend>
      <option>Коралловый</option>
      <option>Тыквенный</option>
    </optgroup>
    <optgroup label="Жёлтые">
      <legend>Жёлтые</legend>
      <option>Лимонный</option>
      <option>Горчичный</option>
    </optgroup>
  </select>
</body>
</html>
