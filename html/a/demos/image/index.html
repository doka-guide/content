<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Ссылка на изображении — <a> — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      padding: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #18191C;
      color: #FFFFFF;
    }

    /* Оранжевая подложка: на тёмном фоне контур собак не видно */
    a {
      display: block;
      width: 100%;
      max-width: 400px;
      padding: 20px;
      border-radius: 6px;
      background-color: #FF8630;
    }

    a:focus-visible {
      outline: 2px solid #FFFFFF;
      outline-offset: 4px;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
    }

    @media (width <= 768px) {
      body {
        padding: 30px;
      }
    }
  </style>
</head>
<body>
  <a href="https://doka.guide/" target="_blank">
    <img src="images/dogs.png" alt="Дока">
  </a>
</body>
</html>
