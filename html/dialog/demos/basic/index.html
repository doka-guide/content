<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Демонстрация работы — <dialog> — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      padding: 50px;
      display: grid;
      grid-template-columns: repeat(auto-fit, min(100%, 255px));
      place-items: start;
      place-content: start center;
      background-color: #18191c;
      color: #ffffff;
      gap: 20px 25px;
      -webkit-font-smoothing: antialiased;
      font-family: "Roboto", sans-serif;
    }

    @media (width >= 580px) {
      body {
        align-content: center;
        align-items: center;
        padding: 30px;
      }
    }

    .button, .dialog__button {
      display: block;
      min-width: 260px;
      border: 2px solid transparent;
      border-radius: 6px;
      padding: 9px 15px;
      color: #000000;
      font-size: 1.12rem;
      font-weight: 300;
      font-family: inherit;
      transition: background-color 0.2s linear;
    }

    .dialog__button {
      margin: 0 auto;
    }

    .button-orange {
      background-color: #FF8630;
    }

    .button-blue {
      background-color: #2E9AFF;
    }

    .button:hover, .dialog__button:hover {
      background-color: #FFFFFF;
      cursor: pointer;
      transition: background-color 0.2s linear;
    }

    .dialog__button:hover {
      border: 2px solid #000000;
    }

    .button:focus-visible {
      border: 2px solid #FFFFFF;
      outline: none;
    }

    .dialog__button:focus-visible {
      border: 2px solid #000000;
      outline: none;
    }

    .button:focus {
      border: 2px solid #FFFFFF;
      outline: none;
    }

    .dialog__button:focus {
      border: 2px solid #000000;
      outline: none;
    }

    .dialog {
      width: calc(100% - 40px);
      max-width: 400px;
      border: none;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      position: fixed;
    }

    @media (width <= 579px) {
      .dialog {
        /* Сдвигаем диалоговые окна ближе к низу страницы, чтобы они не перекрывали кнопки на демке */
        margin-bottom: 30px;
        bottom: 0;
      }
    }

    .dialog::backdrop {
      background-color: rgb(0 0 0 / 0.6);
      backdrop-filter: blur(10px);
    }

    .dialog__title {
      margin-top: 0;
      margin-bottom: 17px;
      font-weight: 500;
      font-size: 1.375rem;
    }

    .dialog p {
      margin: 15px 0;
      font-size: 1rem;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <button class="button button-orange" type="button" onclick="window['some-dialog-id'].show()" aria-controls="some-dialog-id">
    Открыть диалоговое окно
  </button>
  <button class="button button-blue" type="button" onclick="window['some-modal-id'].showModal()" aria-controls="some-modal-id">
    Открыть модальное окно
  </button>

  <dialog class="dialog" id="some-modal-id" aria-labelledby="dialog-name">
    <h2 class="dialog__title" id="dialog-name">Я модальное окно</h2>
    <p>Весь остальной контент на странице недоступен, когда я открыто.</p>
    <form method="dialog">
      <button class="dialog__button button-orange">
        Ясно-понятно 👍
      </button>
    </form>
  </dialog>

  <dialog class="dialog" id="some-dialog-id" open="open" aria-labelledby="dialog-name-2">
    <h2 class="dialog__title" id="dialog-name-2">Я окно-диалог</h2>
    <p>Несмотря на то, что я поверх кнопок, они по-прежнему доступны.</p>
    <button class="dialog__button button-orange" type="button" onclick="window['some-dialog-id'].close()">
      Окей 👌
    </button>
  </dialog>
</body>
</html>
