<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Блокируем скролл при открытии модальных окон — <dialog> — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      height: 100%;
      scrollbar-color: #FF8630 #18191c;
      scrollbar-width: thin;
      scrollbar-gutter: stable;
      font-size: 16px;
    }

    body {
      height: 100%;
      margin: 0;
      padding: 50px;
      background-color: #18191c;
      color: #FFFFFF;
      font-size: 18px;
      gap: 20px 25px;
      -webkit-font-smoothing: antialiased;
      font-family: "Roboto", sans-serif;
    }

    @media (width <= 768px) {
      body {
        padding: 30px;
      }
    }

    ::-webkit-scrollbar {
      width: 10px;
      background: transparent;
    }

    ::-webkit-scrollbar-track {
      background: #18191c;
    }

    ::-webkit-scrollbar-thumb {
      background: #FF8630;
    }

    .button, .dialog__button {
      display: block;
      min-width: 260px;
      border: 2px solid transparent;
      border-radius: 6px;
      padding: 9px 15px;
      color: #000000;
      font-size: 1.12rem;
      font-weight: 300;
      font-family: inherit;
      transition: background-color 0.2s linear;
    }

    .dialog__button {
      margin: 0 auto;
    }

    .button-orange {
      background-color: #FF8630;
    }

    .button:hover, .dialog__button:hover {
      background-color: #FFFFFF;
      cursor: pointer;
      transition: background-color 0.2s linear;
    }

    .dialog__button:hover {
      border: 2px solid #000000;
    }

    .button:focus-visible {
      border: 2px solid #FFFFFF;
      outline: none;
    }

    .dialog__button:focus-visible {
      border: 2px solid #000000;
      outline: none;
    }

    .button:focus {
      border: 2px solid #FFFFFF;
      outline: none;
    }

    .dialog__button:focus {
      border: 2px solid #000000;
      outline: none;
    }

    .dialog {
      width: calc(100% - 40px);
      max-width: 400px;
      border: none;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      position: fixed;
    }

    .dialog::backdrop {
      background-color: rgb(0 0 0 / 0.5);
    }

    .dialog__title {
      margin-top: 0;
      margin-bottom: 17px;
      font-weight: 500;
      font-size: 1.375rem;
    }

    .dialog p {
      margin: 15px 0;
      font-size: 1rem;
      line-height: 1.4;
    }

    .mock {
      padding: 20px;
      height: 130vh;
      display: grid;
      gap: 20px;
      place-content: start center;
      background-color: #282A2E;
      color: #E6E6E6;
    }

    .scroll-lock {
      overflow: hidden;
    }

    @media (width >= 600px) {
      .mock {
        place-items: center;
      }
    }
  </style>
</head>
<body>
  <main class="mock">
    <p>Я блок, у которого высота больше чем вьюпорта. Просто представьте, что тут о-о-о-очень много контента.</p>
    <button class="button button-orange opener" type="button" aria-controls="modal-example" onclick="openModalAndLockScroll(event)">
      Открыть модальное окно
    </button>
  </main>
  <dialog class="dialog" id="modal-example" onclose="returnScroll()" aria-labelledby="dialog-name">
    <h2 class="dialog__title" id="dialog-name">Я модальное окно</h2>
    <p>Теперь я не только перекрываю остальной контент, но блокирую скролл.</p>
    <form method="dialog">
      <button class="dialog__button button-orange">Агась 🙌</button>
    </form>
  </dialog>

  <script>
    function openModalAndLockScroll({
      target: buttonOpener
    }) {
      const dialogID = buttonOpener.getAttribute('aria-controls');
      const dialogElement = document.querySelector(`#${dialogID}`);
      dialogElement.showModal();
      document.body.classList.add("scroll-lock");
    }

    function returnScroll() {
      document.body.classList.remove("scroll-lock");
    }
  </script>
</body>
</html>
