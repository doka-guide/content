<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Видео разных форматов — <video> — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      padding: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #18191c;
    }
  </style>
</head>
<body>
  <video controls muted poster="images/cinema-vs-reality.jpg" width="580">
    <!-- Сначала WebM с кодеком AV1: файл легче -->
    <source src="video/cinema-vs-reality.webm" type='video/webm; codecs="av01.0.01M.08, opus"'>
    <!-- Запасной вариант: MP4 с кодеком H.264, его проигрывают все браузеры -->
    <source src="video/cinema-vs-reality.mp4" type="video/mp4">
    Ваш браузер не поддерживает встроенные видео.
  </video>
</body>
</html>
