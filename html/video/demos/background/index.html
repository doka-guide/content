<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Видео на фоне — <video> — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Roboto", sans-serif;
    }

    video {
      position: absolute;
      right: 0;
      bottom: 0;
      min-width: 100%;
      min-height: 100%;
    }

    article {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgb(0 0 0 / 0.5);
      color: rgb(241 241 241);
    }

    h1 {
      margin-bottom: 17px;
      font-size: 40px;
      font-weight: 500;
    }

    p {
      font-size: 18px;
    }

    .pause {
      margin-top: 24px;
      padding: 10px 20px;
      border: 2px solid rgb(241 241 241);
      border-radius: 6px;
      background-color: transparent;
      color: rgb(241 241 241);
      font: inherit;
      cursor: pointer;
    }

    .pause:hover,
    .pause:focus-visible {
      background-color: rgb(241 241 241);
      color: rgb(0 0 0);
    }
  </style>
</head>
<body>
    <video autoplay muted loop playsinline>
      <source src="video/storm.webm" type='video/webm; codecs="av01.0.05M.08"'>
      <source src="video/storm.mp4" type="video/mp4">
    </video>
    <article>
      <h1>Банановый эквивалент</h1>
      <p>Мы живём в радиоактивном мире. Это нормально?</p>
      <button class="pause" type="button">Остановить видео</button>
    </article>
    <script>
      const video = document.querySelector('video')
      const button = document.querySelector('.pause')
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)')

      if (reduceMotion.matches) {
        video.pause()
      }

      function updateButton() {
        button.textContent = video.paused ? 'Запустить видео' : 'Остановить видео'
      }

      button.addEventListener('click', () => {
        if (video.paused) {
          video.play()
        } else {
          video.pause()
        }
      })
      video.addEventListener('play', updateButton)
      video.addEventListener('pause', updateButton)
      updateButton()
    </script>
</body>
</html>
