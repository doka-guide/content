<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Текстовый поиск — <mark> — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
      font-size: 18px;
    }

    body {
      min-height: 100vh;
      padding: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #18191C;
      color: #FFFFFF;
      font-family: "Roboto", sans-serif;
    }

    p {
      margin: 7px 0;
      font-size: 1rem;
      line-height: 1.4;
    }

    mark {
      background-color: #FF8630;
      color: #18191C;
    }

    input {
      width: 300px;
      border: 1px solid #FFFFFF;
      border-radius: 6px;
      padding: 10px 15px;
      background-color: transparent;
      color: #FFFFFF;
      font-size: 18px;
      font-weight: 300;
      font-family: inherit;
      -webkit-appearance: none;
      appearance: none;
    }

    input:focus {
      border-color: #FF8630;
      outline: none;
    }

    .container {
      width: 65%;
      padding: 55px 40px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 600px;
      margin-bottom: 25px;
    }

    .row__label {
      margin-right: 55px;
      font-size: 24px;
      font-weight: 500;
      line-height: 1;
    }

    .row__input {
      width: 350px;
    }

    @media (width <= 768px) {
      body {
        padding: 30px;
      }

      .container {
        width: 100%;
        padding: 55px 30px;
      }

      .row {
        display: block;
        max-width: 100%;
      }

      .row__label {
        margin-right: 0;
      }

      .row__input {
        width: 100%;
        margin-top: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="row">
      <label class="row__label" for="search">Введите текст:</label>
      <input class="row__input" type="text" id="search" placeholder="Например, искусство">
    </div>
    <p>
      Душа моя озарена неземной радостью, как эти чудесные весенние утра, которыми я наслаждаюсь от всего сердца. Я совсем один и блаженствую в здешнем краю, словно созданном для таких, как я. Я так счастлив, мой друг, так упоён ощущением покоя, что искусство моё страдает от этого.
    </p>
  </div>
  <script>
    const input = document.querySelector('input')
    const text = document.querySelector('p')
    const originalText = text.textContent

    input.addEventListener('input', (event) => {
      const query = event.currentTarget.value

      if (query.trim() === '') {
        text.textContent = originalText
        return
      }

      text.textContent = ''
      const parts = originalText.split(query)

      parts.forEach((part, index) => {
        text.append(part)

        if (index < parts.length - 1) {
          const mark = document.createElement('mark')
          mark.textContent = query
          text.append(mark)
        }
      })
    })
  </script>
</body>
</html>
