<!DOCTYPE html>
<html lang="ru">
<head>
  <title>JavaScript меняет размер шрифта — script — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      padding: 50px;
      background-color: #18191C;
      font-family: "Roboto", sans-serif;
    }

    .container {
      width: 65%;
      margin: auto;
      padding: 55px 40px;
      background-color: #FF8630;
      color: #000000;
    }

    h1 {
      font-size: 26px;
      font-weight: 500;
      margin-bottom: 17px;
    }

    p {
      transition: font-size 0.3s linear;
    }

    .pause {
      margin-top: 20px;
      padding: 10px 20px;
      border: 2px solid #000000;
      border-radius: 6px;
      background-color: transparent;
      color: #000000;
      font-family: inherit;
      font-size: 16px;
      cursor: pointer;
    }

    .pause:focus-visible {
      outline: 2px solid #000000;
      outline-offset: 2px;
    }

    @media (width <= 768px) {
      body {
        padding: 30px;
      }

      .container {
        width: 100%;
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Подключение скриптов</h1>
    <p id="blinking">Скрипты можно подключить разными способами. Например, описать их прямо внутри HTML-страницы. Но лучше всё же в отдельном файле.</p>
    <button class="pause" type="button">Пауза</button>
  </div>
  <script>
    const p = document.getElementById('blinking');
    const pauseButton = document.querySelector('.pause');
    let timerId = null;

    function start() {
      timerId = setInterval(function () {
        const newFontSize = p.style.fontSize !== '10px' ? 10 : 20;
        p.style.fontSize = `${newFontSize}px`;
      }, 2000);
    }

    // Кнопка останавливает и снова запускает анимацию
    pauseButton.addEventListener('click', function () {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
        pauseButton.textContent = 'Продолжить';
      } else {
        start();
        pauseButton.textContent = 'Пауза';
      }
    });

    start();
  </script>
</body>
</html>
