<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" xml:space="preserve">
<!-- экран браузера -->
<rect x="130" y="170" width="1660" height="670" rx="34" fill="#fff" stroke="#000" stroke-width="14"/>

<!-- навигация без текста -->
<g stroke="#000" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
  <path d="M130 270h1660"/>
  <circle cx="200" cy="220" r="16" fill="#41E847"/>
  <circle cx="254" cy="220" r="16" fill="#fff"/>
  <circle cx="308" cy="220" r="16" fill="#fff"/>
  <rect x="500" y="202" width="220" height="36" rx="18" fill="#fff"/>
  <rect x="760" y="202" width="180" height="36" rx="18" fill="#fff"/>
  <rect x="980" y="202" width="220" height="36" rx="18" fill="#41E847"/>
  <path d="M1530 202v36M1580 202v36M1630 202v36"/>
</g>

<!-- содержимое viewport, нижняя часть намеренно обрезается -->
<clipPath id="desktop-viewport">
  <rect x="144" y="270" width="1632" height="542"/>
</clipPath>
<g clip-path="url(#desktop-viewport)">
  <!-- самый большой элемент, занимающий всю ширину -->
  <rect x="144" y="315" width="1632" height="260" fill="#41E847" stroke="#000" stroke-width="14"/>
  <path d="M260 520 560 370l220 112 260-132 460 170" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- два следующих элемента находятся ниже экрана -->
  <rect x="340" y="630" width="560" height="230" rx="18" fill="#fff" stroke="#000" stroke-width="14"/>
  <rect x="1020" y="630" width="560" height="230" rx="18" fill="#fff" stroke="#000" stroke-width="14"/>
</g>

<!-- нижняя граница экрана подчёркивает обрезание карточек -->
<path d="M130 812h1660" stroke="#000" stroke-width="14"/>

</svg>
