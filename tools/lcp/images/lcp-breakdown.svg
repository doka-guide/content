<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1692 345" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="lcp-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9fb0cc"/>
    </marker>
  </defs>

  <!-- временная шкала, ширина пропорциональна доле времени: 40% / 10% / 40% / 10% -->
  <g transform="translate(40,20)">
    <!-- TTFB ~40% -->
    <rect x="0" y="0" width="640" height="200" rx="10" fill="#1668c7"/>
    <text x="320" y="96" fill="#fff" font-size="36" font-weight="700" text-anchor="middle">TTFB</text>
    <text x="320" y="140" fill="#cfe2fb" font-size="26" text-anchor="middle">~40%</text>

    <!-- resource load delay <10% -->
    <rect x="644" y="0" width="160" height="200" rx="10" fill="#5b8def"/>
    <text x="724" y="58" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">Задержка</text>
    <text x="724" y="90" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">загрузки</text>
    <text x="724" y="122" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">ресурса</text>
    <text x="724" y="160" fill="#e6efff" font-size="22" text-anchor="middle">&lt;10%</text>

    <!-- resource load duration ~40% -->
    <rect x="808" y="0" width="640" height="200" rx="10" fill="#3f8f1f"/>
    <text x="1128" y="80" fill="#fff" font-size="30" font-weight="700" text-anchor="middle">Длительность</text>
    <text x="1128" y="118" fill="#fff" font-size="30" font-weight="700" text-anchor="middle">загрузки ресурса</text>
    <text x="1128" y="158" fill="#dcefcf" font-size="26" text-anchor="middle">~40%</text>

    <!-- render delay <10% -->
    <rect x="1452" y="0" width="160" height="200" rx="10" fill="#c77f16"/>
    <text x="1532" y="68" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">Задержка</text>
    <text x="1532" y="100" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">отрисовки</text>
    <text x="1532" y="160" fill="#fce9cf" font-size="22" text-anchor="middle">&lt;10%</text>

    <!-- ось -->
    <line x1="0" y1="230" x2="1604" y2="230" stroke="#9fb0cc" stroke-width="3" marker-end="url(#lcp-arrow)"/>
    <text x="0" y="300" fill="#52617e" font-size="47">переход на страницу</text>
    <text x="1612" y="300" fill="#52617e" font-size="47" text-anchor="end">элемент отрисован</text>
  </g>
</svg>
