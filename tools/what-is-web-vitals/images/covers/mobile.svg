<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" xml:space="preserve">
<!-- фоновые абстрактные акценты (симметричны относительно x=540) -->
<circle fill="#000" cx="120" cy="140" r="24"/>
<circle fill="#000" cx="960" cy="140" r="24"/>
<circle fill="#000" cx="120" cy="940" r="18"/>
<circle fill="#000" cx="960" cy="940" r="18"/>

<!-- корпус спидометра: сплошное чёрное кольцо шкалы -->
<g transform="translate(540,600)">
  <path d="M -400 0 A 400 400 0 0 1 400 0" fill="none" stroke="#000" stroke-width="54" stroke-linecap="round"/>

  <!-- деления -->
  <g stroke="#FFF" stroke-width="9" stroke-linecap="round">
    <path d="M -346.4 -200 L -331.4 -191.5"/>
    <path d="M -200 -346.4 L -191.5 -331.4"/>
    <path d="M 0 -400 L 0 -382"/>
    <path d="M 200 -346.4 L 191.5 -331.4"/>
    <path d="M 346.4 -200 L 331.4 -191.5"/>
  </g>

  <!-- стрелка индикатора -->
  <g transform="rotate(-52)">
    <path d="M 0 -358 L -17 25 A 17 17 0 0 0 17 25 Z" fill="#000"/>
  </g>

  <!-- ось -->
  <circle r="38" fill="#000"/>
  <circle r="22" fill="#41E847"/>
</g>

<!-- три точки-метрики на дуге -->
<g fill="#41E847">
  <circle cx="140" cy="600" r="14"/>
  <circle cx="540" cy="253.6" r="14"/>
  <circle cx="940" cy="600" r="14"/>
</g>

<!-- декоративные линии снизу (симметричны относительно x=540) -->
<g stroke="#000" stroke-width="9" stroke-linecap="round" fill="none">
  <path d="M 150 980 L 260 980"/>
  <path d="M 300 980 L 420 980"/>
  <path d="M 660 980 L 780 980"/>
  <path d="M 820 980 L 930 980"/>
</g>
</svg>
