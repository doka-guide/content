<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Зависимости на светофоре — Signals — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #18191c;
      color: #ffffff;
      font-family: "Roboto", sans-serif;
    }

    .demo {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .demo__intersection {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .demo__light {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px;
      background-color: #0e0f11;
      border-radius: 14px;

      &-bulb {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        opacity: 0.25;
        transition: opacity 0.15s ease;

        &--red { background-color: #ff6b6b; }
        &--yellow { background-color: #ffd166; }
        &--green { background-color: #6ee7b7; }
      }

      &[data-state="red"] .demo__light-bulb--red {
        opacity: 1;
        box-shadow: 0 0 14px 2px #ff6b6b;
      }

      &[data-state="yellow"] .demo__light-bulb--yellow {
        opacity: 1;
        box-shadow: 0 0 14px 2px #ffd166;
      }

      &[data-state="green"] .demo__light-bulb--green {
        opacity: 1;
        box-shadow: 0 0 14px 2px #6ee7b7;
      }
    }

    .demo__switch {
      appearance: none;
      border: none;
      cursor: pointer;
      position: absolute;
      top: 50%;
      right: 0;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      padding: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #18191c;
      background-color: #ffd166;
      transition: transform 0.15s ease;

      &:hover:not(:disabled) {
        transform: translateY(-50%) scale(1.06);
      }

      &:disabled {
        opacity: 0.6;
        cursor: default;
      }
    }

    .demo__columns {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .demo__panel {
      border: 1px solid #33343a;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;

      &-title {
        font-size: 15px;
        font-weight: 500;
        color: #a9abb3;
      }
    }

    .demo__row {
      display: flex;
      flex-direction: column;
      gap: 4px;

      &-label {
        font-size: 12px;
        color: #a9abb3;
      }

      &-value {
        overflow-wrap: anywhere;
        font-variant-numeric: tabular-nums;
        font-size: 15px;
        font-weight: 500;
        color: #ffffff;
      }

      &--recalcs {
        align-items: center;
        margin-top: 2px;
        padding-top: 10px;
        border-top: 1px solid #33343a;

        .demo__row-value {
          font-size: 26px;
          color: #c4b5fd;

          &--worse { color: #ff6b6b; }
          &--better { color: #6ee7b7; }
        }
      }
    }

    @media (max-width: 480px) {
      .demo__columns {
        gap: 10px;
      }

      .demo__panel {
        padding: 12px;
      }

      .demo__row-value {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="demo">
    <div class="demo__intersection">
      <div class="demo__light" id="light" data-state="red">
        <span class="demo__light-bulb demo__light-bulb--red"></span>
        <span class="demo__light-bulb demo__light-bulb--yellow"></span>
        <span class="demo__light-bulb demo__light-bulb--green"></span>
      </div>
      <button id="switch-light" class="demo__switch" type="button" title="Переключить свет" aria-label="Переключить свет">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
          <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
          <path d="M21 21v-5h-5"/>
        </svg>
      </button>
    </div>

    <div class="demo__columns">
      <div class="demo__panel">
        <h2 class="demo__panel-title">Наивный pub/sub</h2>
        <div class="demo__row">
          <span class="demo__row-label">Сигнал для машин</span>
          <span class="demo__row-value" id="pubsub-cars">🔴 Стоп</span>
        </div>
        <div class="demo__row">
          <span class="demo__row-label">Сигнал для пешеходов</span>
          <span class="demo__row-value" id="pubsub-pedestrians">🚶 Идите</span>
        </div>
        <div class="demo__row">
          <span class="demo__row-label">Табло перекрёстка</span>
          <span class="demo__row-value" id="pubsub-board">🚶 Идут пешеходы</span>
        </div>
        <div class="demo__row demo__row--recalcs">
          <span class="demo__row-label">Пересчётов табло</span>
          <span class="demo__row-value" id="pubsub-recalcs">0</span>
        </div>
      </div>

      <div class="demo__panel">
        <h2 class="demo__panel-title">Сигналы</h2>
        <div class="demo__row">
          <span class="demo__row-label">Сигнал для машин</span>
          <span class="demo__row-value" id="signal-cars">🔴 Стоп</span>
        </div>
        <div class="demo__row">
          <span class="demo__row-label">Сигнал для пешеходов</span>
          <span class="demo__row-value" id="signal-pedestrians">🚶 Идите</span>
        </div>
        <div class="demo__row">
          <span class="demo__row-label">Табло перекрёстка</span>
          <span class="demo__row-value" id="signal-board">🚶 Идут пешеходы</span>
        </div>
        <div class="demo__row demo__row--recalcs">
          <span class="demo__row-label">Пересчётов табло</span>
          <span class="demo__row-value" id="signal-recalcs">0</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.documentElement.className = document.documentElement.className.replace('no-js', 'js')

    const byId = (id) => document.getElementById(id)

    const LIGHTS = ['red', 'yellow', 'green', 'yellow']

    const carsMessage = (light) => {
      if (light === 'green') return '🟢 Езжайте'
      if (light === 'yellow') return '🟡 Приготовьтесь'
      return '🔴 Стоп'
    }

    const pedestriansMessage = (light) => light === 'red' ? '🚶 Идите' : '✋ Ждите'

    const boardMessage = (cars, pedestrians) => {
      if (cars.includes('🟢')) return '🚗 Едут машины'
      if (pedestrians.includes('🚶')) return '🚶 Идут пешеходы'
      return '⏳ Ждут все'
    }

    function createPubSubDiamond() {
      let light = 'red'
      let recalcs = 0

      const listeners = { light: [] }
      const emit = (key) => listeners[key]?.forEach((fn) => fn())

      const getCars = () => carsMessage(light)
      const getPedestrians = () => pedestriansMessage(light)

      const recalcBoard = () => {
        recalcs += 1
        byId('pubsub-board').textContent = boardMessage(getCars(), getPedestrians())
        byId('pubsub-recalcs').textContent = recalcs
      }

      listeners.light.push(() => {
        byId('pubsub-cars').textContent = getCars()
        recalcBoard()
      })
      listeners.light.push(() => {
        byId('pubsub-pedestrians').textContent = getPedestrians()
        recalcBoard()
      })

      return {
        setLight(value) {
          light = value
          emit('light')
        },
        getRecalcs: () => recalcs
      }
    }

    function createSignalDiamond() {
      let light = 'red'
      let boardRecalcs = 0

      let carsValue = carsMessage(light)
      let pedestriansValue = pedestriansMessage(light)
      let boardValue = boardMessage(carsValue, pedestriansValue)

      let carsDirty = false
      let pedestriansDirty = false
      let boardDirty = false

      const getCars = () => {
        if (carsDirty) {
          carsValue = carsMessage(light)
          carsDirty = false
        }
        return carsValue
      }

      const getPedestrians = () => {
        if (pedestriansDirty) {
          pedestriansValue = pedestriansMessage(light)
          pedestriansDirty = false
        }
        return pedestriansValue
      }

      const getBoard = () => {
        if (boardDirty) {
          boardRecalcs += 1
          boardValue = boardMessage(getCars(), getPedestrians())
          boardDirty = false
        }
        return boardValue
      }

      const render = () => {
        byId('signal-cars').textContent = getCars()
        byId('signal-pedestrians').textContent = getPedestrians()
        byId('signal-board').textContent = getBoard()
        byId('signal-recalcs').textContent = boardRecalcs
      }

      render()

      return {
        setLight(value) {
          light = value
          carsDirty = true
          pedestriansDirty = true
          boardDirty = true
          render()
        },
        getRecalcs: () => boardRecalcs
      }
    }

    const pubsub = createPubSubDiamond()
    const signals = createSignalDiamond()
    const switchButton = byId('switch-light')
    const lightIndicator = byId('light')
    const pubsubRecalcsEl = byId('pubsub-recalcs')
    const signalRecalcsEl = byId('signal-recalcs')

    const updateRecalcsDiff = () => {
      const pubsubRecalcs = pubsub.getRecalcs()
      const signalRecalcs = signals.getRecalcs()

      pubsubRecalcsEl.classList.remove('demo__row-value--worse', 'demo__row-value--better')
      signalRecalcsEl.classList.remove('demo__row-value--worse', 'demo__row-value--better')

      if (pubsubRecalcs === signalRecalcs) {
        pubsubRecalcsEl.classList.add('demo__row-value--better')
        signalRecalcsEl.classList.add('demo__row-value--better')
        return
      }

      pubsubRecalcsEl.classList.add('demo__row-value--worse')
      signalRecalcsEl.classList.add('demo__row-value--better')
    }

    updateRecalcsDiff()

    let step = 0
    let switching = false

    switchButton.addEventListener('click', () => {
      if (switching) return
      switching = true
      switchButton.disabled = true

      step = (step + 1) % LIGHTS.length
      const next = LIGHTS[step]
      lightIndicator.dataset.state = next
      pubsub.setLight(next)
      signals.setLight(next)
      updateRecalcsDiff()

      setTimeout(() => {
        switching = false
        switchButton.disabled = false
      }, 200)
    })
  </script>
</body>
</html>
