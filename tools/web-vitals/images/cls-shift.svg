<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- ДО: без баннера. Отмена сверху, Купить снизу. Палец целится в Купить. -->
  <g transform="translate(120,60)">
    <text x="130" y="-20" fill="#52617e" font-size="26" font-weight="700" text-anchor="middle">До загрузки баннера</text>
    <rect width="260" height="300" rx="16" fill="#fff" stroke="#cdd8ea" stroke-width="2"/>
    <rect x="24" y="24" width="212" height="70" rx="8" fill="#eef2f9"/>
    <text x="130" y="65" fill="#9fb0cc" font-size="18" text-anchor="middle">заголовок</text>
    <rect x="24" y="110" width="212" height="90" rx="8" fill="#eef2f9"/>
    <text x="130" y="160" fill="#9fb0cc" font-size="18" text-anchor="middle">текст</text>
    <rect x="24" y="212" width="212" height="34" rx="8" fill="#d64545"/>
    <text x="130" y="234" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">Отмена</text>
    <!-- кнопка «Купить», сюда целится палец -->
    <rect x="24" y="252" width="212" height="34" rx="8" fill="#1f9d55"/>
    <text x="130" y="274" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">Купить</text>
    <circle cx="130" cy="269" r="17" fill="#1668c7" fill-opacity="0.25" stroke="#1668c7" stroke-width="2"/>
  </g>

  <text x="500" y="220" fill="#c77f16" font-size="48" font-weight="800" text-anchor="middle">→</text>

  <!-- ПОСЛЕ: баннер сверху сдвинул контент вниз. Палец не двигался и оказался на «Отмена». -->
  <g transform="translate(620,60)">
    <text x="130" y="-20" fill="#52617e" font-size="26" font-weight="700" text-anchor="middle">Баннер догрузился</text>
    <rect width="260" height="300" rx="16" fill="#fff" stroke="#cdd8ea" stroke-width="2"/>
    <rect x="24" y="24" width="212" height="50" rx="8" fill="#d64545"/>
    <text x="130" y="55" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">★ реклама</text>
    <rect x="24" y="86" width="212" height="60" rx="8" fill="#eef2f9"/>
    <text x="130" y="122" fill="#9fb0cc" font-size="18" text-anchor="middle">заголовок</text>
    <rect x="24" y="158" width="212" height="70" rx="8" fill="#eef2f9"/>
    <text x="130" y="199" fill="#9fb0cc" font-size="18" text-anchor="middle">текст</text>
    <!-- «Отмена» уехала вниз и оказалась там, где раньше была «Купить» — сюда попадает палец -->
    <rect x="24" y="252" width="212" height="34" rx="8" fill="#d64545"/>
    <text x="130" y="274" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">Отмена</text>
    <!-- палец остался на старом месте -->
    <circle cx="130" cy="269" r="17" fill="#1668c7" fill-opacity="0.35" stroke="#1668c7" stroke-width="2"/>
  </g>
  <text x="500" y="400" fill="#52617e" font-size="26" text-anchor="middle">Контент уехал вниз — палец попадает на «Отмена» вместо «Купить»</text>
</svg>
