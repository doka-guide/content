<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="180" viewBox="0 0 1000 180" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="inp-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9fb0cc"/>
    </marker>
  </defs>

  <g transform="translate(40,20)">
    <!-- input delay -->
    <rect x="0" y="0" width="300" height="70" rx="8" fill="#c77f16"/>
    <text x="150" y="32" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">Задержка ввода</text>
    <text x="150" y="56" fill="#fce9cf" font-size="15" text-anchor="middle">главный поток занят</text>

    <rect x="306" y="0" width="300" height="70" rx="8" fill="#3f8f1f"/>
    <text x="456" y="32" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">Обработка</text>
    <text x="456" y="56" fill="#dcefcf" font-size="15" text-anchor="middle">работа обработчиков</text>

    <rect x="612" y="0" width="308" height="70" rx="8" fill="#1668c7"/>
    <text x="766" y="32" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">Отрисовка</text>
    <text x="766" y="56" fill="#cfe2fb" font-size="15" text-anchor="middle">показ нового кадра</text>

    <line x1="0" y1="92" x2="912" y2="92" stroke="#9fb0cc" stroke-width="3" marker-end="url(#inp-arrow)"/>
    <text x="0" y="128" fill="#52617e" font-size="16.5">пользователь нажал</text>
    <text x="920" y="128" fill="#52617e" font-size="16.5" text-anchor="end">увидел отклик</text>
  </g>
</svg>
