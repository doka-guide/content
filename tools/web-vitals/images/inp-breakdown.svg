    <line x1="0" y1="92" x2="920" y2="92" stroke="#9fb0cc" stroke-width="2"/>
    <text x="0" y="118" fill="#52617e" font-size="16">пользователь нажал</text>
    <text x="920" y="118" fill="#52617e" font-size="16" text-anchor="end">увидел отклик</text>
