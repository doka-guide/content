<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="180" viewBox="0 0 1692 180" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="lcp-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9fb0cc"/>
    </marker>
  </defs>

  <!-- временная шкала, ширина пропорциональна доле времени: 40% / 10% / 40% / 10% -->
  <g transform="translate(40,20)">
    <!-- TTFB ~40% -->
    <rect x="0" y="0" width="640" height="100" rx="8" fill="#1668c7"/>
    <text x="320" y="46" fill="#fff" font-size="22" font-weight="700" text-anchor="middle">TTFB</text>
    <text x="320" y="72" fill="#cfe2fb" font-size="16" text-anchor="middle">~40%</text>

    <!-- resource load delay <10% -->
    <rect x="644" y="0" width="160" height="100" rx="8" fill="#5b8def"/>
    <text x="724" y="38" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">Задержка загрузки</text>
    <text x="724" y="56" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">ресурса</text>
    <text x="724" y="78" fill="#e6efff" font-size="13" text-anchor="middle">&lt;10%</text>

    <!-- resource load duration ~40% -->
    <rect x="808" y="0" width="640" height="100" rx="8" fill="#3f8f1f"/>
    <text x="1128" y="46" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">Длительность загрузки ресурса</text>
    <text x="1128" y="72" fill="#dcefcf" font-size="16" text-anchor="middle">~40%</text>

    <!-- render delay <10% -->
    <rect x="1452" y="0" width="160" height="100" rx="8" fill="#c77f16"/>
    <text x="1532" y="38" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">Задержка</text>
    <text x="1532" y="56" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">отрисовки</text>
    <text x="1532" y="78" fill="#fce9cf" font-size="13" text-anchor="middle">&lt;10%</text>

    <!-- ось -->
    <line x1="0" y1="122" x2="1604" y2="122" stroke="#9fb0cc" stroke-width="2" marker-end="url(#lcp-arrow)"/>
    <text x="0" y="148" fill="#52617e" font-size="16">переход на страницу</text>
    <text x="1612" y="148" fill="#52617e" font-size="16" text-anchor="end">элемент отрисован</text>
  </g>
</svg>
