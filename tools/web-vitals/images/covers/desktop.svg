<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" xml:space="preserve">
<!-- фоновые абстрактные акценты (симметричны относительно x=960) -->
<circle fill="#000" cx="140" cy="150" r="28"/>
<circle fill="#000" cx="1780" cy="150" r="28"/>
<circle fill="#000" cx="140" cy="930" r="20"/>
<circle fill="#000" cx="1780" cy="930" r="20"/>
<path d="M0 1040h1920v4H0z" fill="#000"/>

<!-- корпус спидометра: сплошное чёрное кольцо шкалы -->
<g transform="translate(960,600)">
  <path d="M -480 0 A 480 480 0 0 1 480 0" fill="none" stroke="#000" stroke-width="64" stroke-linecap="round"/>

  <!-- деления -->
  <g stroke="#FFF" stroke-width="10" stroke-linecap="round">
    <path d="M -415.7 -240 L -398.2 -230"/>
    <path d="M -240 -415.7 L -230 -398.2"/>
    <path d="M 0 -480 L 0 -460"/>
    <path d="M 240 -415.7 L 230 -398.2"/>
    <path d="M 415.7 -240 L 398.2 -230"/>
  </g>

  <!-- стрелка индикатора -->
  <g transform="rotate(-52)">
    <path d="M 0 -430 L -20 30 A 20 20 0 0 0 20 30 Z" fill="#000"/>
  </g>

  <!-- ось -->
  <circle r="44" fill="#000"/>
  <circle r="26" fill="#41E847"/>
</g>

<!-- три точки-метрики на дуге -->
<g fill="#41E847">
  <circle cx="480" cy="600" r="16"/>
  <circle cx="960" cy="184.3" r="16"/>
  <circle cx="1440" cy="600" r="16"/>
</g>

<!-- декоративные линии снизу (симметричны относительно x=960) -->
<g stroke="#000" stroke-width="10" stroke-linecap="round" fill="none">
  <path d="M 200 950 L 320 950"/>
  <path d="M 360 950 L 560 950"/>
  <path d="M 1360 950 L 1560 950"/>
  <path d="M 1600 950 L 1720 950"/>
</g>
</svg>
