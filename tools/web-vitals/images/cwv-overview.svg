<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <g transform="translate(40,5)">
    <rect width="290" height="230" rx="20" fill="#fff" stroke="#7cc4ff" stroke-width="3"/>
    <text x="145" y="70" fill="#1668c7" font-size="48" font-weight="800" text-anchor="middle">LCP</text>
    <text x="145" y="115" fill="#1b2950" font-size="23" font-weight="700" text-anchor="middle">Загрузка</text>
    <text x="145" y="155" fill="#52617e" font-size="20" text-anchor="middle">Когда виден</text>
    <text x="145" y="182" fill="#52617e" font-size="20" text-anchor="middle">главный контент</text>
    <text x="145" y="218" fill="#1f9d55" font-size="22" font-weight="800" text-anchor="middle">≤ 2.5 с</text>
  </g>

  <g transform="translate(355,5)">
    <rect width="290" height="230" rx="20" fill="#fff" stroke="#9ad07a" stroke-width="3"/>
    <text x="145" y="70" fill="#3f8f1f" font-size="48" font-weight="800" text-anchor="middle">INP</text>
    <text x="145" y="115" fill="#1b2950" font-size="23" font-weight="700" text-anchor="middle">Отзывчивость</text>
    <text x="145" y="155" fill="#52617e" font-size="20" text-anchor="middle">Как быстро сайт</text>
    <text x="145" y="182" fill="#52617e" font-size="20" text-anchor="middle">отвечает на действие</text>
    <text x="145" y="218" fill="#1f9d55" font-size="22" font-weight="800" text-anchor="middle">≤ 200 мс</text>
  </g>

  <g transform="translate(670,5)">
    <rect width="290" height="230" rx="20" fill="#fff" stroke="#f2b66d" stroke-width="3"/>
    <text x="145" y="70" fill="#c77f16" font-size="48" font-weight="800" text-anchor="middle">CLS</text>
    <text x="145" y="115" fill="#1b2950" font-size="23" font-weight="700" text-anchor="middle">Стабильность</text>
    <text x="145" y="155" fill="#52617e" font-size="20" text-anchor="middle">Не прыгает ли</text>
    <text x="145" y="182" fill="#52617e" font-size="20" text-anchor="middle">макет под пальцем</text>
    <text x="145" y="218" fill="#1f9d55" font-size="22" font-weight="800" text-anchor="middle">≤ 0.1</text>
  </g>
</svg>
