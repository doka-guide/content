<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <style>
    .label { fill: #52617e; }
    .sublabel { fill: #1b2950; }
    @media (prefers-color-scheme: dark) {
      .label { fill: #b8c2d9; }
      .sublabel { fill: #fff; }
    }
  </style>

  <g transform="translate(40,0)">
    <rect width="290" height="230" rx="20" fill="none" stroke="#7cc4ff" stroke-width="3"/>
    <text x="145" y="70" fill="#1668c7" font-size="48" font-weight="800" text-anchor="middle">LCP</text>
    <text class="sublabel" x="145" y="115" font-size="23" font-weight="700" text-anchor="middle">Загрузка</text>
    <text class="label" x="145" y="155" font-size="20" text-anchor="middle">Когда виден</text>
    <text class="label" x="145" y="182" font-size="20" text-anchor="middle">главный контент</text>
    <text x="145" y="218" fill="#1f9d55" font-size="22" font-weight="800" text-anchor="middle">≤ 2,5 с</text>
  </g>

  <g transform="translate(355,0)">
    <rect width="290" height="230" rx="20" fill="none" stroke="#9ad07a" stroke-width="3"/>
    <text x="145" y="70" fill="#3f8f1f" font-size="48" font-weight="800" text-anchor="middle">INP</text>
    <text class="sublabel" x="145" y="115" font-size="23" font-weight="700" text-anchor="middle">Отзывчивость</text>
    <text class="label" x="145" y="155" font-size="20" text-anchor="middle">Как быстро сайт</text>
    <text class="label" x="145" y="182" font-size="20" text-anchor="middle">отвечает на действие</text>
    <text x="145" y="218" fill="#1f9d55" font-size="22" font-weight="800" text-anchor="middle">≤ 200 мс</text>
  </g>

  <g transform="translate(670,0)">
    <rect width="290" height="230" rx="20" fill="none" stroke="#f2b66d" stroke-width="3"/>
    <text x="145" y="70" fill="#c77f16" font-size="48" font-weight="800" text-anchor="middle">CLS</text>
    <text class="sublabel" x="145" y="115" font-size="23" font-weight="700" text-anchor="middle">Стабильность</text>
    <text class="label" x="145" y="155" font-size="20" text-anchor="middle">Не прыгает ли</text>
    <text class="label" x="145" y="182" font-size="20" text-anchor="middle">макет под пальцем</text>
    <text x="145" y="218" fill="#1f9d55" font-size="22" font-weight="800" text-anchor="middle">≤ 0,1</text>
  </g>
</svg>
