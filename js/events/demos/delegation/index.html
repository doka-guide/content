<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Делегирование событий — Событийная модель — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-size: 24px;
    }

    body {
      min-height: 100vh;
      padding: 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #18191C;
      color: #FFFFFF;
      font-family: "Roboto", sans-serif;
    }

    h4 {
      margin-bottom: 17px;
      font-weight: 500;
      font-size: 1.125rem;
      align-self: flex-start;
    }

    .container {
      display: flex;
      flex-direction: column;
    }

    ul {
      padding-left: 50px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      list-style-type: none;
    }

    .task {
      position: relative;
      padding: 0 0 0 25px;
      border: none;
      font: inherit;
      font-size: 1rem;
      text-align: left;
      text-transform: lowercase;
      color: inherit;
      background-color: transparent;
      cursor: pointer;
    }

    .task:focus-visible {
      outline: 2px solid #FFD829;
      outline-offset: 2px;
    }

    .task::before {
      content: "";
      position: absolute;
      top: 10px;
      left: 0;
      width: 14px;
      height: 14px;
      background-color: #FF8630;
    }

    .task:hover {
      color: #FFD829;
    }

    .task[aria-pressed="true"] {
      text-decoration: line-through;
    }
  </style>
</head>
<body>
  <div class="container">
    <h4>Задачи:</h4>
    <ul id="tasks">
      <li><button class="task" type="button" aria-pressed="false">Купить хлеб</button></li>
      <li><button class="task" type="button" aria-pressed="false">Покормить кота</button></li>
      <li><button class="task" type="button" aria-pressed="false">Сделать ДЗ</button></li>
    </ul>
  </div>

  <script>
    const tasksList = document.getElementById('tasks')

    tasksList.addEventListener('click', (event) => {
      // Ищем ближайшую кнопку задачи
      const task = event.target.closest('.task')

      // Проверяем, что кнопка внутри нашего списка
      if (task && tasksList.contains(task)) {
        // Отмечаем задачу выполненной или снимаем отметку
        const isDone = task.getAttribute('aria-pressed') === 'true'
        task.setAttribute('aria-pressed', String(!isDone))
      }
    })
  </script>
</body>
</html>
