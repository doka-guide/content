<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Делегирование событий — Событийная модель — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100vh;
      padding: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #18191C;
      color: #FFFFFF;
      font-size: 18px;
      font-family: "Roboto", sans-serif;
    }

    .container {
      width: 100%;
      max-width: 320px;
    }

    h4 {
      margin-bottom: 20px;
      font-weight: 500;
      font-size: 22px;
    }

    ul {
      display: flex;
      flex-direction: column;
      gap: 10px;
      list-style-type: none;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 8px 15px;
      border: 2px solid rgb(255 255 255 / 0.2);
      border-radius: 6px;
      font: inherit;
      text-align: left;
      color: inherit;
      background-color: transparent;
      cursor: pointer;
      transition: border-color 0.2s linear;
    }

    /* Квадрат-отметка слева от текста */
    .task::before {
      content: "";
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      border: 2px solid #FFD829;
      border-radius: 4px;
      transition: background-color 0.2s linear;
    }

    .task:hover {
      border-color: #FFD829;
    }

    .task:focus-visible {
      outline: 2px solid #FFD829;
      outline-offset: 2px;
    }

    /* Выполненная задача */
    .task[aria-pressed="true"] {
      color: rgb(255 255 255 / 0.6);
      text-decoration: line-through;
    }

    .task[aria-pressed="true"]::before {
      background-color: #FFD829;
    }
  </style>
</head>
<body>
  <div class="container">
    <h4>Задачи:</h4>
    <ul id="tasks">
      <li><button class="task" type="button" aria-pressed="false">Купить хлеб</button></li>
      <li><button class="task" type="button" aria-pressed="false">Покормить кота</button></li>
      <li><button class="task" type="button" aria-pressed="false">Сделать ДЗ</button></li>
    </ul>
  </div>

  <script>
    const tasksList = document.getElementById('tasks')

    tasksList.addEventListener('click', (event) => {
      // Ищем ближайшую кнопку задачи
      const task = event.target.closest('.task')

      // Проверяем, что кнопка внутри нашего списка
      if (task && tasksList.contains(task)) {
        // Отмечаем задачу выполненной или снимаем отметку
        const isDone = task.getAttribute('aria-pressed') === 'true'
        task.setAttribute('aria-pressed', String(!isDone))
      }
    })
  </script>
</body>
</html>
