<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Содержимое DOM-элементов — Element — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono&display=swap">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      padding: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #18191C;
      color: #FFFFFF;
      font-family: "Roboto", sans-serif;
    }

    .demo {
      width: 100%;
      max-width: 560px;
    }

    .hint {
      margin-bottom: 12px;
      color: rgb(255 255 255 / 0.6);
      font-size: 14px;
    }

    /* Меню, по которому кликают */
    .menu {
      padding: 12px;
      border: 1px solid #282A2E;
      border-radius: 6px;
      list-style: none;
      cursor: pointer;
    }

    .menu-item {
      padding: 8px 12px;
      border-radius: 4px;
      background-color: #282A2E;
    }

    .menu-item + .menu-item {
      margin-top: 6px;
    }

    .menu-item a {
      color: #FFFFFF;
    }

    /* Выбранный элемент */
    .active {
      outline: 2px solid #FFD829;
      outline-offset: 2px;
    }

    .info {
      margin-top: 20px;
      font-size: 16px;
      line-height: 1.4;
    }

    .info p + p,
    .info h2 + p {
      margin-top: 6px;
    }

    .info h2 {
      font-size: 14px;
      font-weight: 500;
      color: #FFD829;
    }

    .info p + h2 {
      margin-top: 14px;
    }

    .label {
      color: rgb(255 255 255 / 0.6);
    }

    code {
      font-family: "Roboto Mono", monospace;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    @media (width <= 768px) {
      /* Высота подписей меняется, поэтому прижимаем демку к верху, чтобы меню не прыгало */
      body {
        padding: 30px;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="demo">
    <p class="hint">Кликните на пункт меню или ссылку</p>
    <div class="playground">
      <ul id="main-menu" class="menu">
        <li id="home" class="menu-item"><a href="#">Главная</a></li>
        <li id="articles" class="menu-item"><a href="#">Статьи</a></li>
        <li id="contacts" class="menu-item"><a href="#">Контакты</a></li>
      </ul>
    </div>
    <div class="info">
      <p><span class="label">Выделен:</span> <code id="current"></code></p>
      <h2>innerHTML</h2>
      <p><code id="inner"></code></p>
      <h2>outerHTML</h2>
      <p><code id="outer"></code></p>
      <h2>textContent</h2>
      <p><code id="text"></code></p>
    </div>
  </div>

  <script>
    const menu = document.getElementById('main-menu')
    const currentInfo = document.getElementById('current')
    const innerInfo = document.getElementById('inner')
    const outerInfo = document.getElementById('outer')
    const textInfo = document.getElementById('text')
    let active

    function getInfo(element) {
      const tag = `<${element.tagName.toLowerCase()}>`
      return element.id ? `${tag}, id: ${element.id}` : tag
    }

    function select(element) {
      if (active) {
        active.classList.remove('active')
        // У ссылок своего класса нет, убираем пустой атрибут
        if (active.classList.length === 0) {
          active.removeAttribute('class')
        }
      }

      // Читаем свойства до подсветки, чтобы в разметку не попал класс active
      currentInfo.textContent = getInfo(element)
      innerInfo.textContent = element.innerHTML
      outerInfo.textContent = element.outerHTML
      textInfo.textContent = element.textContent

      element.classList.add('active')
      active = element
    }

    menu.addEventListener('click', (event) => {
      // Ссылки в демке никуда не ведут
      event.preventDefault()
      // Список целиком не выбираем: его разметка слишком длинная
      if (event.target === menu) {
        return
      }
      select(event.target)
    })

    select(document.getElementById('articles'))
  </script>
</body>
</html>
