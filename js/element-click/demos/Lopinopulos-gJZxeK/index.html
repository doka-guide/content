<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Как работает событие — click — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      padding: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #18191C;
      color: #FFFFFF;
      font-family: "Roboto", sans-serif;
    }

    .demo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      text-align: center;
    }

    .button {
      padding: 12px 24px;
      border: 2px solid #FFD829;
      border-radius: 6px;
      background-color: transparent;
      color: #FFFFFF;
      font: inherit;
      font-size: 18px;
      cursor: pointer;
    }

    .button:hover,
    .button:focus-visible {
      background-color: #FFD829;
      color: #18191C;
    }

    .info {
      min-height: 1.5em;
      font-size: 18px;
    }

    @media (width <= 768px) {
      body {
        padding: 30px;
      }
    }
  </style>
</head>
<body>
  <div class="demo">
    <button class="button" type="button">Кликните по кнопке</button>
    <p class="info" aria-live="polite"></p>
  </div>

  <script>
    const button = document.querySelector('.button')
    const info = document.querySelector('.info')

    button.addEventListener('click', function (event) {
      // У клика с клавиатуры или из кода detail равен 0
      if (event.detail === 0) {
        info.textContent = 'Кликнули не мышкой и не пальцем: detail равен 0'
      } else {
        info.textContent = `Кликов подряд: ${event.detail}`
      }
    })
  </script>
</body>
</html>
