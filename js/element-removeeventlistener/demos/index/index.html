<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Element.removeEventListener — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" >
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap">
  <style>
    html {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
    }

    body {
      padding: 5%;
      background-color: #18191c;
      color: #ffffff;
      font-family: "Roboto", sans-serif;
      font-size: 18px;
      text-align: center;
      overflow: hidden;
    }

    kbd {
      font-family: "Roboto Mono", monospace;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    .event {
      position: relative;
      min-height: 100px;
    }

    .event span {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      font-style: italic;
    }

    .event kbd {
      font-size: 64px;
      line-height: 1;
      overflow-wrap: anywhere;
    }

    .hint {
      margin-top: 20px;
    }

    .inline-key {
      font-size: 0.9em;
    }

    .restart {
      margin-top: 20px;
      padding: 10px 20px;
      border: 2px solid #FFD829;
      border-radius: 6px;
      background-color: #282A2E;
      color: #FFFFFF;
      font-family: inherit;
      font-size: 18px;
      cursor: pointer;
    }

    .restart:hover {
      background-color: #FFD829;
      color: #18191C;
    }

    .restart:focus-visible {
      outline: 2px solid #FFFFFF;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="event" id="output"><span>Кликните сюда и нажмите любую клавишу</span></div>

    <p class="hint" id="hint-listen">Чтобы остановить обработку нажатий клавиатуры, нажмите <kbd class="inline-key">Escape</kbd></p>
    <p class="hint" id="hint-removed" hidden>Обработчик удалён, нажатия больше не видны</p>

    <button class="restart" id="restart" type="button" hidden>Слушать снова</button>
  </div>

  <script>
    const output = document.getElementById('output')
    const hintListen = document.getElementById('hint-listen')
    const hintRemoved = document.getElementById('hint-removed')
    const restart = document.getElementById('restart')

    function showPrompt() {
      const prompt = document.createElement('span')
      prompt.textContent = 'Нажмите любую клавишу'
      output.replaceChildren(prompt)
    }

    // Переключаем подсказки и кнопку
    function setListening(isListening) {
      hintListen.hidden = !isListening
      hintRemoved.hidden = isListening
      restart.hidden = isListening
    }

    function handleKey(event) {
      const key = document.createElement('kbd')
      key.textContent = event.key
      output.replaceChildren(key)

      if (event.key === 'Escape') {
        window.removeEventListener('keydown', handleKey)
        setListening(false)
      }
    }

    // Снова добавляем тот же обработчик
    restart.addEventListener('click', () => {
      window.addEventListener('keydown', handleKey)
      showPrompt()
      setListening(true)
    })

    window.addEventListener('keydown', handleKey)
  </script>
</body>
</html>
