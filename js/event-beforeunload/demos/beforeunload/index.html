<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Обработка события beforeunload — Дока</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      padding: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #18191C;
      color: #FFFFFF;
      font-family: "Roboto", sans-serif;
    }

    /* === стили демо === */

    .demo {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .label {
      font-size: 18px;
      font-weight: 500;
    }

    .field {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #282A2E;
      border-radius: 6px;
      font: inherit;
      font-size: 18px;
      color: #FFFFFF;
      background-color: #282A2E;
    }

    .field:focus-visible {
      outline: none;
      border-color: #FFD829;
    }

    .button {
      align-self: flex-start;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font: inherit;
      font-size: 18px;
      font-weight: 500;
      color: #18191C;
      background-color: #FFD829;
      cursor: pointer;
    }

    .button:focus-visible {
      outline: 2px solid #FFFFFF;
      outline-offset: 2px;
    }

    .status {
      font-size: 16px;
      color: rgb(255 255 255 / 0.7);
    }

    @media (width <= 768px) {
      body {
        padding: 30px;
      }
    }
  </style>
</head>
<body>
  <div class="demo">
    <label class="label" for="note">Заметка</label>
    <input class="field" id="note" type="text" autocomplete="off">
    <button class="button" type="button">Обновить страницу</button>
    <p class="status" aria-live="polite">Поле пустое, страница обновится без окна подтверждения.</p>
  </div>

  <script>
    const input = document.querySelector('.field')
    const button = document.querySelector('.button')
    const status = document.querySelector('.status')

    function handleBeforeUnload(event) {
      event.preventDefault()
      // Для браузеров на Chromium до 119
      event.returnValue = true
    }

    input.addEventListener('input', () => {
      if (input.value !== '') {
        window.addEventListener('beforeunload', handleBeforeUnload)
        status.textContent = 'Есть несохранённый текст, браузер покажет окно подтверждения.'
      } else {
        window.removeEventListener('beforeunload', handleBeforeUnload)
        status.textContent = 'Поле пустое, страница обновится без окна подтверждения.'
      }
    })

    button.addEventListener('click', () => {
      window.location.reload()
    })
  </script>
</body>
</html>
