css:
  files:
    - css/**/*
html:
  files:
    - html/**/*
js:
  files:
    - js/**/*
'веб-платформа':
  files:
    - tools/**/*
a11y:
  files:
    - a11y/**/*
'рецепт':
  files:
    - recipes/**/*
'кухня':
  files:
    - .github/*.yml
    - .github/scripts/*.js
    - .github/workflows/*.yml
    - CHANGELOG.md
    - docs/**/*
    - pages/**/*
'собеседование':
  files:
    # Только новые вопросы и ответы: правки старых ответов часто едут
    # в одном пулреквесте со статьёй, и там этот ярлык лишний.
    added:
      - interviews/**/*
# `css/*/**` вместо `css/**`: оглавление раздела `css/index.md` правят в каждом
# пулреквесте с новой статьёй, и без исключения ярлык ставился бы и туда.
'улучшение':
  files:
    modified:
      - css/*/**/*.md
      - html/*/**/*.md
      - js/*/**/*.md
      - tools/*/**/*.md
      - a11y/*/**/*.md
      - recipes/*/**/*.md
      - docs/*.md
      - docs/**/*.md
      - docs/images/*.png
      - docs/license/*/*.svg
      - pages/**/index.md
      - people/**/index.md
      - README.md
      - LICENSE-ND.md
      - LICENSE-SA.md
    removed:
      - css/*/**/*.md
      - html/*/**/*.md
      - js/*/**/*.md
      - tools/*/**/*.md
      - a11y/*/**/*.md
      - recipes/*/**/*.md
      - docs/*.md
      - docs/**/*.md
      - docs/images/*.png
      - docs/license/*/*.svg
      - pages/**/index.md
      - people/**/index.md
      - README.md
      - LICENSE-ND.md
      - LICENSE-SA.md
    renamed:
      - css/*/**/*.md
      - html/*/**/*.md
      - js/*/**/*.md
      - tools/*/**/*.md
      - a11y/*/**/*.md
      - recipes/*/**/*.md
      - docs/*.md
      - docs/**/*.md
      - docs/images/*.png
      - docs/license/*/*.svg
      - pages/**/index.md
      - people/**/index.md
      - README.md
      - LICENSE-ND.md
      - LICENSE-SA.md
'демо':
  files:
    modified:
      - css/**/demos/**/*.html
      - html/**/demos/**/*.html
      - js/**/demos/**/*.html
      - tools/**/demos/**/*.html
      - a11y/**/demos/**/*.html
      - recipes/**/demos/**/*.html
# Тип материала ставится на любой пулреквест, который его трогает, а не только
# на новый: так ярлыки работали годами, и редакция на них опирается.
'дока':
  meta:
    tags:
      - doka
'статья':
  meta:
    tags:
      - article
# Условия ярлыка складываются через AND: только новая заготовка. Когда
# заготовку дописывают до статьи, этот ярлык лишний.
placeholder:
  files:
    added:
      - css/**/index.md
      - html/**/index.md
      - js/**/index.md
      - tools/**/index.md
      - a11y/**/index.md
      - recipes/**/index.md
  meta:
    tags:
      - placeholder
