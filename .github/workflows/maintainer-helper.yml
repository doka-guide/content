name: Maintainer Helper

on:
  push:
    branches:
      - main

# `editor-helper.js`, `demos-helper.js` и `description-helper.js` переписывают
# тела задач-списков через `PATCH /repos/{owner}/{repo}/issues/{issue_number}`.
permissions:
  contents: read
  issues: write

jobs:
  update-lists:
    # Списки строятся полным пересчётом meta (editors, contributors, tags,
    # description) по всем статьям, а не диффом. Автокоммит бота
    # («Обновляет мету, даты, словарь и ченджлог» из main-maintenance.yml)
    # трогает только даты, словарь и ченджлог — meta он не меняет, так что
    # пересчёт на нём даёт тот же результат, что уже посчитал прогон на
    # коммите, который бот обслуживал. Условие то же, что в
    # main-maintenance.yml — отсекаем по сообщению коммита, а не по автору:
    # под тем же Doka Dog в main пишет ещё и еженедельный featured.
    if: ${{ !startsWith(github.event.head_commit.message, 'Обновляет мету, даты, словарь и ченджлог') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Формирует список меты файлов
        run: |
          echo '{"type": "module","dependencies": {"@octokit/core": "^5.0.0","node-fetch": "^3.3.2"}}' > package.json
          npm install
          npx yaml-cat --format json --output result.json css/**/index.md html/**/index.md js/**/index.md tools/**/index.md a11y/**/index.md
      - name: Обновление списков материалов-кандидатов на редактирование
        run: node .github/scripts/editor-helper.js --github-key ${{ secrets.GITHUB_TOKEN }}
      - name: Обновление списков материалов-кандидатов на доработку демок
        run: node .github/scripts/demos-helper.js --github-key ${{ secrets.GITHUB_TOKEN }}
      - name: Обновление списков материалов с дескрипшенами и без
        run: node .github/scripts/description-helper.js --github-key ${{ secrets.GITHUB_TOKEN }}
