# Сборка превью пулреквеста. Четыре джобы: превью (гейт по галкам и заметка),
# сборка, публикация и отчёт.
#
# Каждая джоба получает только те права и секреты, которые нужны ей самой.
# Ключ публикации есть только у публикации, токен с правом записи — только у
# превью и отчёта. Не объединяйте джобы обратно и не добавляйте секреты в сборку.
#
# У пулреквеста из форка прогон «PR Checks» (pull_request) не стартует сам: он
# висит в состоянии action_required, пока мейнтейнер не нажмёт «Approve and
# run», и до одобрения галок не существует вовсе. Раньше сборка сидела на
# pull_request_target и опрашивала Checks API до пятнадцати минут — она всегда
# упиралась в таймаут, держала раннер и писала в описание «не прошли проверки
# пулреквеста», хотя те даже не запускались. Поэтому здесь `workflow_run`:
# галки читаются один раз, опрашивать уже нечего.
#
# Заметка о начале живёт в отдельном воркфлоу «PR Preview Note»: ей нужен
# другой триггер, а разные триггеры в одном файле означали бы джобы, которые
# половину прогонов висят серыми.
#
# Тесты заметки: node --test .github/scripts/preview-note.test.js
#               node --test .github/scripts/preview-links.test.js

name: PR Preview

on:
  workflow_run:
    workflows:
      - "PR Checks"
    types:
      - completed
    # Фильтра по ветке здесь быть не должно: у пулреквеста из форка ветка
    # называется как угодно, и `branches: main` отсёк бы вообще всё.

# Новый коммит в пулреквест отменяет прогон на предыдущем. Без этого в гонку
# попадали два прогона сразу: старый финишировал позже нового и затирал его
# заметку в описании пулреквеста. Номера пулреквеста здесь ещё нет —
# `workflow_run.pull_requests` пуст для веток из форков, — поэтому ключ
# собирается из форка и ветки.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

# Права у каждой джобы свои, на уровне воркфлоу — ничего.
permissions: {}

jobs:
  # `pull-requests` нужен и заметке, и шагу выборки файлов: всё, что не
  # перечислено, выставляется в none, и `gh api .../pulls/N/files` падает с 403.
  # `checks: write` — ради галки «Превью».
  preview:
    name: Превью
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      pull-requests: write
    outputs:
      state: ${{ steps.gate.outputs.state }}
      failed: ${{ steps.gate.outputs.failed }}
      pull-number: ${{ steps.gate.outputs.pull-number }}
      check-id: ${{ steps.check.outputs.check-id }}
      links: ${{ steps.links.outputs.list }}
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      PATH_TO_CONTENT: ./content
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # Только `preview-note.js` и только из ветки по умолчанию. `ref` задан
      # явно, а не оставлен по умолчанию: джоба ходит с правами на запись, и
      # чекаут кода из форка означал бы выполнение чужого кода под этим
      # токеном. Отдельный `path`, чтобы не столкнуться с чекаутом контента.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          path: base
          persist-credentials: false
      # Скрипты лежат в RUNNER_TEMP, отдельно от файлов пулреквеста.
      - name: Копия скриптов заметки
        run: cp base/.github/scripts/preview-note.js base/.github/scripts/preview-links.js "$RUNNER_TEMP/"

      # Галки читаются один раз: проверки уже завершились, опрашивать нечего.
      - name: Галки проверок
        id: gate
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo
            const run = context.payload.workflow_run
            const sha = run.head_sha

            // Прогон, который ждёт одобрения мейнтейнера или был пропущен, —
            // не повод трогать заметку: её уже написал воркфлоу заметки, и
            // написал точнее. Отменённый прогон, наоборот, должен дойти до
            // отчёта, иначе после ручной отмены в описании навсегда останется
            // «идут проверки».
            const idle = ['action_required', 'skipped']
            if (idle.includes(run.status) || idle.includes(run.conclusion)) {
              core.info(`Прогон проверок в состоянии ${run.status}/${run.conclusion}, делать нечего`)
              core.setOutput('state', 'idle')
              return
            }

            // Как найти пулреквест, если `workflow_run.pull_requests` пуст —
            // а для веток из форков он пуст всегда.
            //
            // Поиск по коммиту (`commits/{sha}/pulls`) для форков не работает:
            // на коммите e02898e9 пулреквеста #6025 он не показал ни через
            // тринадцать секунд, ни через десять минут — ноль результатов.
            // Превью уходило в `idle`, шаги пропускались, отчёт не писался, и
            // в описании навсегда оставалось «идут проверки». С переезда на
            // `workflow_run` так молча ломалось каждое превью из форка, #6069
            // и #6025 в их числе.
            //
            // Поэтому запасной путь — поиск по ветке-источнику: для форка это
            // `владелец:ветка`, и он отвечает сразу. Поиск по коммиту оставлен
            // первым: для веток самого репозитория он точнее, потому что
            // привязан к коммиту, а не к текущей вершине ветки.
            const headRepository = run.head_repository?.full_name || ''
            const headOwner = headRepository.split('/')[0]

            const findPull = async () => {
              const { data: byCommit } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: sha,
              })
              const fromCommit = byCommit.find((item) => item.state === 'open') || byCommit[0]
              if (fromCommit) return fromCommit

              if (!headOwner || !run.head_branch) return null
              const { data: byHead } = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                head: `${headOwner}:${run.head_branch}`,
                per_page: 100,
              })
              return byHead.find((item) => item.head.sha === sha) || byHead[0] || null
            }

            // Две попытки: обычно хватает первой, вторая — на случай, когда
            // пулреквест только что открыли и он ещё не виден ни одной ручке.
            let pull = null
            for (let attempt = 1; attempt <= 2; attempt += 1) {
              pull = await findPull()
              if (pull) break
              core.info(`Попытка ${attempt}: пулреквест для ${sha} не нашёлся`)
              if (attempt < 2) await new Promise((resolve) => setTimeout(resolve, 10000))
            }
            if (!pull) {
              // Предупреждением, а не тихой строкой в логе: без пулреквеста
              // заметку писать некуда, и человек останется с «идут проверки».
              core.warning(`Пулреквест по коммиту ${sha} не нашёлся, превью не собираем`)
              core.setOutput('state', 'idle')
              return
            }
            core.setOutput('pull-number', pull.number)

            const names = ['Форматирование', 'Мета', 'Ссылки']
            const { data } = await github.rest.checks.listForRef({ owner, repo, ref: sha, per_page: 100 })
            const checks = names.map((name) => data.check_runs.find((item) => item.name === name))

            // skipped и neutral провалом не считаются. Орфографии в списке нет
            // намеренно: опечатки превью не блокируют, текст как раз удобно
            // вычитывать на превью.
            const passed = ['success', 'skipped', 'neutral']
            // Отменённая проверка — не провал, а незавершённость.
            const unfinished = ['cancelled', 'stale']

            const failed = checks.filter(
              (check) =>
                check &&
                check.status === 'completed' &&
                !passed.includes(check.conclusion) &&
                !unfinished.includes(check.conclusion),
            )
            if (failed.length) {
              core.setOutput('state', 'failed')
              core.setOutput('failed', failed.map((check) => check.name).join(', '))
              return
            }

            const done = checks.every(
              (check) => check && check.status === 'completed' && passed.includes(check.conclusion),
            )
            core.setOutput('state', done ? 'passed' : 'unfinished')

      # Открывает галку «Превью» ровно в момент старта сборки: до сих пор она
      # заводилась только в самом конце («Отчёт в пулреквесте»), и все
      # ~10-15 минут сборки в списке проверок пулреквеста не было ни строки —
      # узнать что-то можно было только из заметки в описании. `in_progress`
      # даёт пулреквесту живой индикатор на всё время сборки; id уходит в
      # отчёт, чтобы обновить эту же галку, а не плодить вторую.
      - name: Открытие галки превью
        id: check
        if: ${{ steps.gate.outputs.state == 'passed' }}
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo
            const { data } = await github.rest.checks.create({
              owner,
              repo,
              name: 'Превью',
              head_sha: process.env.HEAD_SHA,
              status: 'in_progress',
              details_url: process.env.RUN_URL,
            })
            core.setOutput('check-id', data.id)

      # Дальше — только если проверки прошли. Заметка о сборке пишется до
      # чекаута форка: пока в рабочем дереве нет чужого кода, писать в
      # пулреквест безопаснее.
      - name: Заметка о сборке
        if: ${{ steps.gate.outputs.state == 'passed' }}
        uses: actions/github-script@v9
        env:
          PULL_NUMBER: ${{ steps.gate.outputs.pull-number }}
        with:
          script: |
            const note = require(`${process.env.RUNNER_TEMP}/preview-note.js`)
            const { owner, repo } = context.repo
            const headSha = process.env.HEAD_SHA

            await note.writeNote({
              github,
              owner,
              repo,
              pullNumber: Number(process.env.PULL_NUMBER),
              message: `Проверки пройдены, идёт сборка превью контента из ${headSha}. [Подробнее](${process.env.RUN_URL})`,
              headSha,
            })

      # Список файлов пулреквеста со статусом: по нему скрипт ссылок отличает
      # удалённые и переименованные материалы. Файл лежит в RUNNER_TEMP, вне
      # рабочего дерева, как и скрипты заметки.
      # `continue-on-error` здесь и на шаге ссылок: без списка материалов
      # превью всё равно нужно, а упавший шаг пропустил бы сборку, и отчёт
      # написал бы «ошибка сборки», которой не было.
      - name: Выборка изменённых файлов
        if: ${{ steps.gate.outputs.state == 'passed' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_NUMBER: ${{ steps.gate.outputs.pull-number }}
        run: |
          set -eu
          gh api --paginate \
            "repos/${{ github.repository }}/pulls/${PULL_NUMBER}/files?per_page=100" \
            --jq '.[] | {filename, status, previous_filename}' \
            > "$RUNNER_TEMP/pr-files.jsonl"
          echo "Изменено файлов: $(wc -l < "$RUNNER_TEMP/pr-files.jsonl")"

      # Контент здесь нужен только скрипту ссылок. Токен после чекаута не
      # нужен, поэтому `persist-credentials: false`.
      - name: Загрузка контента
        if: ${{ steps.gate.outputs.state == 'passed' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: content
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      # Какой файл куда ведёт — в preview-links.js: совет «На практике» — на
      # якорь в статье, демка — на свою страницу, вопрос с собеседования — в
      # статьи из его `related`. Поэтому шаг стоит после чекаута контента:
      # `related` читается оттуда. Скрипт из ветки по умолчанию, файлы
      # пулреквеста он только читает. Пустой выход — блока не будет.
      - name: Формирование ссылок на материалы
        id: links
        if: ${{ steps.gate.outputs.state == 'passed' }}
        continue-on-error: true
        env:
          DEPLOY_DOMAIN: https://content-${{ steps.gate.outputs.pull-number }}.dev.doka.guide
          FILES: ${{ runner.temp }}/pr-files.jsonl
        run: node "$RUNNER_TEMP/preview-links.js"

  # Сборке не нужны секреты и запись: токен только читает и после чекаута
  # не сохраняется.
  build:
    name: Сборка
    needs: preview
    if: ${{ needs.preview.outputs.state == 'passed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PATH_TO_CONTENT: ./content
    steps:
      - name: Загрузка platform
        uses: actions/checkout@v6
        with:
          repository: doka-guide/platform
          persist-credentials: false
      - name: Загрузка контента
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: content
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - name: Загрузка кеша
        uses: actions/checkout@v6
        with:
          repository: doka-guide/cache
          path: cache
          persist-credentials: false
      # Версия берётся из .nvmrc платформы: именно её зависимости здесь
      # ставятся. Зашитая версия разъезжается с платформой — так превью и
      # выкатка сломались, когда платформа перешла на Node 24, а здесь
      # осталась двадцатая.
      # У платформы в package.json есть devEngines.packageManager, и setup-node
      # v6 включил бы кеш npm сам. Кеш из прогона с кодом PR не нужен.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Установка модулей
        run: npm ci
      - name: Копирование кеша
        run: cp ./cache/issues.json ./.issues.json
      # Сборка молчит около двух минут. Без отметок шаг выглядит зависшим.
      - name: Сборка сайта
        run: |
          set -eu
          cp .env.example .env
          echo "Начало: $(date -u +%H:%M:%S) UTC. Сборка занимает пару минут и молчит до конца."
          npm run build
          echo "Готово: $(date -u +%H:%M:%S) UTC. Страниц собрано: $(find dist -name '*.html' | wc -l)."
      # Скрытые файлы upload-artifact пропускает, и это нужно: штатная сборка
      # их не создаёт, а файлы из форка вроде `.well-known/` оказались бы на
      # поддомене Доки. Симлинки upload-artifact разворачивает в обычные
      # файлы, поэтому на сервер они не попадут.
      - name: Сохранение сборки
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  # Единственная джоба с ключом публикации. Чекаут ей не нужен: она только
  # скачивает `dist` и выгружает его по rsync.
  deploy:
    name: Публикация
    needs: [preview, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    steps:
      - name: Загрузка сборки
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # Прод лежит на том же диске сервера. Если сборка разрастётся, она займёт
      # место прода, поэтому выше 2 ГБ не шлём. Обычная сборка весит около 640 МБ.
      - name: Проверка размера сборки
        run: |
          set -eu
          LIMIT=$((2 * 1024 * 1024 * 1024))
          SIZE=$(du -sb dist | cut -f1)
          echo "Размер сборки: $((SIZE / 1024 / 1024)) МБ, предел $((LIMIT / 1024 / 1024)) МБ."
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::Сборка весит $((SIZE / 1024 / 1024)) МБ, больше предела. Превью не публикуем."
            exit 1
          fi
      - name: Установка ключа для пользователя
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -eu
          mkdir "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/doka_deploy"
          chmod 600 "$HOME/.ssh/doka_deploy"

      - name: Публикация сайта
        env:
          DEPLOY_DOMAIN: https://content-${{ needs.preview.outputs.pull-number }}.dev.doka.guide
          PULL_NUMBER: ${{ needs.preview.outputs.pull-number }}
        run: |
          set -eu
          # Публикация молчит дольше сборки. Без отметок шаг выглядит зависшим.
          echo "Начало: $(date -u +%H:%M:%S) UTC. Отправляется $(du -sh dist | cut -f1)."
          # Соединение с сервером иногда замирает посреди передачи: ssh жив, данные
          # не идут, и rsync без таймаута ждёт до timeout-minutes джобы. --timeout
          # обрывает такую передачу через минуту тишины, ServerAlive — мёртвое
          # соединение. Повтор безопасен: rsync дошлёт только то, что не успел.
          #
          # --checksum, потому что у свежей сборки новые даты у всех файлов, и по
          # размеру с датой rsync считал изменёнными почти все 11 тысяч файлов и
          # переписывал их на сервере. Сборка детерминирована, так что по
          # содержимому меняются только задетые пулреквестом страницы.
          SSH_COMMAND="ssh -i $HOME/.ssh/doka_deploy -o StrictHostKeyChecking=no -o BatchMode=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          PREVIEWS=/web/sites/dev.doka.guide/content
          $SSH_COMMAND deploy@dev.doka.guide mkdir -p "$PREVIEWS/${PULL_NUMBER}"
          # Доступа к серверу у мейнтейнеров нет, и место на диске видно только
          # здесь. Превью лежат на одном диске с продом.
          $SSH_COMMAND deploy@dev.doka.guide df -h "$PREVIEWS" || true

          # У нового пулреквеста папка на сервере пустая, и rsync слал все
          # ~640 МБ по сети. При 300 кБ/с это дольше timeout-minutes: превью
          # #6196 оборвалось на 89%. --copy-dest берёт файлы из папок на том же
          # сервере, и по сети едет только разница.
          #
          # rsync берёт из основы только файлы с тем же путём и тем же
          # содержимым (по --checksum), лишнего не приносит. Файл он копирует
          # локально на сервере. --link-dest вместо копии ставил бы жёсткую
          # ссылку при совпавшем mtime, и у превью с продом появились бы общие
          # файлы. Папки превью и прода должны быть независимы.
          #
          # Основы: прод и самое свежее соседнее превью. Прод всегда полный, а
          # самая свежая папка превью часто ещё выгружается и полупустая. Нет
          # папки или её нельзя прочитать — rsync предупредит и отправит файлы
          # по сети, код выхода не изменится.
          PRODUCTION=/web/sites/doka.guide/www
          REFERENCE=$($SSH_COMMAND deploy@dev.doka.guide \
            "ls -1t '$PREVIEWS'" 2>/dev/null \
            | grep -E '^[0-9]+$' | grep -vx "${PULL_NUMBER}" | head -n 1 || true)
          COPY_DEST=""
          if [ -n "$REFERENCE" ]; then
            COPY_DEST="--copy-dest=$PREVIEWS/$REFERENCE"
            echo "Основа для выгрузки: прод и превью #$REFERENCE."
          else
            echo "Соседнего превью нет, основа — только прод."
          fi

          cd dist
          for attempt in 1 2 3; do
            # --info=progress2 показывает общий прогресс одной обновляемой строкой,
            # а не портянку из десятков тысяч имён файлов, как прежний --progress.
            rsync -e "$SSH_COMMAND" --timeout=60 --archive --checksum --compress --delete --info=progress2 \
              "--copy-dest=$PRODUCTION" ${COPY_DEST:+"$COPY_DEST"} \
              . "deploy@dev.doka.guide:$PREVIEWS/${PULL_NUMBER}" && break
            [ "$attempt" -lt 3 ] || exit 1
            echo ""
            echo "::warning::rsync прервался, попытка $attempt из 3"
            sleep 15
          done
          echo ""
          echo "Готово: $(date -u +%H:%M:%S) UTC."

          echo "Ссылка на превью — ${DEPLOY_DOMAIN}"

  # Итоговая заметка. always(), иначе при упавших проверках или сборке в
  # описании навсегда останется «идёт сборка…». Скрипт заметки снова из ветки
  # по умолчанию: у отчёта своя машина, и копии скриптов из первой джобы сюда
  # не попадают.
  report:
    name: Отчёт
    needs: [preview, build, deploy]
    if: ${{ always() && needs.preview.outputs.pull-number != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Отчёт в пулреквесте
        if: ${{ always() && needs.preview.outputs.state != '' && needs.preview.outputs.state != 'idle' }}
        uses: actions/github-script@v9
        env:
          CHECK_ID: ${{ needs.preview.outputs.check-id }}
          DEPLOY_DOMAIN: https://content-${{ needs.preview.outputs.pull-number }}.dev.doka.guide
          FAILED: ${{ needs.preview.outputs.failed }}
          IS_PUBLISHED: ${{ needs.deploy.result == 'success' }}
          LINKS: ${{ needs.preview.outputs.links }}
          PULL_NUMBER: ${{ needs.preview.outputs.pull-number }}
          STATE: ${{ needs.preview.outputs.state }}
        with:
          script: |
            const note = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/preview-note.js`)
            const { owner, repo } = context.repo
            const pullNumber = Number(process.env.PULL_NUMBER)
            const sha = process.env.HEAD_SHA
            if (!pullNumber) {
              core.warning('Номер пулреквеста не определился, заметку не пишем')
              return
            }

            const state = process.env.STATE
            const isPublished = process.env.IS_PUBLISHED === 'true'

            // У гейта три исхода, и у каждого своя формулировка: раньше на всё,
            // кроме успеха, писалось «не прошли проверки» — в том числе когда
            // они не запускались вовсе.
            let message
            let conclusion
            let tone
            if (state === 'failed') {
              const failed = process.env.FAILED ? ` (${process.env.FAILED})` : ''
              message = `Превью контента из ${sha} не опубликовано: не прошли проверки пулреквеста${failed}. [Подробнее](${process.env.RUN_URL})`
              // Красная галка нужна только на нашей поломке: провал проверок
              // уже виден отдельной красной галкой, дублировать его незачем.
              conclusion = 'neutral'
              tone = 'warning'
            } else if (state !== 'passed') {
              message = `Превью контента из ${sha} не опубликовано: проверки пулреквеста не завершились. [Подробнее](${process.env.RUN_URL})`
              conclusion = 'neutral'
              tone = 'warning'
            } else if (isPublished) {
              // Раскрывашка — отдельной строкой: так GitHub разбирает её как
              // HTML-блок, а не как продолжение абзаца, и `_` в слагах не
              // превращается в курсив.
              const links = process.env.LINKS ? `\n${process.env.LINKS}` : ''
              message = `<a href="${process.env.DEPLOY_DOMAIN}">Превью контента</a> из ${sha} опубликовано.${links}`
              conclusion = 'success'
              tone = 'tip'
            } else {
              message = `Превью контента из ${sha} не опубликовано. Ошибка сборки или публикации. [Подробнее](${process.env.RUN_URL})`
              conclusion = 'failure'
              tone = 'caution'
            }

            const written = await note.writeNote({ github, owner, repo, pullNumber, message, headSha: sha, tone })
            const checkId = process.env.CHECK_ID
            if (written === null) {
              core.info(`Коммит ${sha} устарел, заметку не трогаем`)
              // Галку «Превью» на этом коммите мог уже открыть шаг «Открытие
              // галки превью». Без закрытия она навсегда висит `in_progress`.
              if (checkId) {
                await github.rest.checks.update({
                  owner,
                  repo,
                  check_run_id: Number(checkId),
                  status: 'completed',
                  conclusion: 'neutral',
                  details_url: process.env.RUN_URL,
                  output: {
                    title: 'Превью не опубликовано',
                    summary: `В пулреквесте уже есть коммит новее ${sha}. Превью собирается для него.`,
                  },
                })
              }
              return
            }

            // Джобы воркфлоу на `workflow_run` в списке проверок пулреквеста
            // не видны: сам прогон висит на вершине ветки по умолчанию, туда же
            // уходят его галки, а коммит пулреквеста лежит в
            // `workflow_run.head_sha` и только здесь. Поэтому галку заводим
            // руками, иначе о превью в пулреквесте не будет ни строки.
            //
            // Если шаг «Открытие галки превью» уже завёл её (гейт был
            // `passed`), дозакрываем ту же галку — иначе в списке проверок
            // повисли бы две строки «Превью» разом. Если не завёл (`failed`
            // или `unfinished`, сборка не начиналась), заводим её здесь же.
            const output = {
              title: conclusion === 'success' ? 'Превью опубликовано' : 'Превью не опубликовано',
              summary: message,
            }
            if (checkId) {
              await github.rest.checks.update({
                owner,
                repo,
                check_run_id: Number(checkId),
                status: 'completed',
                conclusion,
                details_url: process.env.RUN_URL,
                output,
              })
            } else {
              await github.rest.checks.create({
                owner,
                repo,
                name: 'Превью',
                head_sha: sha,
                status: 'completed',
                conclusion,
                details_url: process.env.RUN_URL,
                output,
              })
            }

      # Комментарии прошлой схемы. Убираем оставшиеся, чтобы в ленте не висело
      # вечное «Идёт сборка...». Шаг можно удалить, когда их не останется.
      - name: Уборка старых комментариев
        if: ${{ always() }}
        uses: actions/github-script@v9
        continue-on-error: true
        env:
          PULL_NUMBER: ${{ needs.preview.outputs.pull-number }}
        with:
          script: |
            const { owner, repo } = context.repo
            const issue_number = Number(process.env.PULL_NUMBER)
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            })
            for (const comment of comments) {
              const isBot = comment.user?.login === 'github-actions[bot]'
              if (isBot && (comment.body || '').includes('Превью контента')) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: comment.id })
              }
            }
