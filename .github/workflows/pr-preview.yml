# Сборка превью пулреквеста: одна джоба — одна строка в списке проверок, а
# гейт, сборка, публикация и отчёт разворачиваются внутри неё шагами.
#
# У пулреквеста из форка прогон «PR Checks» (pull_request) не стартует сам: он
# висит в состоянии action_required, пока мейнтейнер не нажмёт «Approve and
# run», и до одобрения галок не существует вовсе. Раньше сборка сидела на
# pull_request_target и опрашивала Checks API до пятнадцати минут — она всегда
# упиралась в таймаут, держала раннер и писала в описание «не прошли проверки
# пулреквеста», хотя те даже не запускались. Поэтому здесь `workflow_run`:
# галки читаются один раз, опрашивать уже нечего.
#
# Заметка о начале живёт в отдельном воркфлоу «PR Preview Note»: ей нужен
# другой триггер, а разные триггеры в одном файле означали бы джобы, которые
# половину прогонов висят серыми.
#
# Тесты заметки: node --test .github/scripts/preview-note.test.js

name: PR Preview

on:
  workflow_run:
    workflows:
      - "PR Checks"
    types:
      - completed
    # Фильтра по ветке здесь быть не должно: у пулреквеста из форка ветка
    # называется как угодно, и `branches: main` отсёк бы вообще всё.

# Новый коммит в пулреквест отменяет прогон на предыдущем. Без этого в гонку
# попадали два прогона сразу: старый финишировал позже нового и затирал его
# заметку в описании пулреквеста. Номера пулреквеста здесь ещё нет —
# `workflow_run.pull_requests` пуст для веток из форков, — поэтому ключ
# собирается из форка и ветки.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

# `pull-requests` нужен и заметке, и шагу выборки файлов: всё, что не
# перечислено, выставляется в none, и `gh api .../pulls/N/files` падает с 403.
permissions:
  contents: read
  checks: read
  pull-requests: write

jobs:
  preview:
    name: Превью
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      PATH_TO_CONTENT: ./content
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # Только `preview-note.js` и только из ветки по умолчанию. `ref` задан
      # явно, а не оставлен по умолчанию: джоба ходит с правами на запись, и
      # чекаут кода из форка означал бы выполнение чужого кода под этим
      # токеном. Отдельный `path`, чтобы не столкнуться с чекаутом платформы.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          path: base

      # Галки читаются один раз: проверки уже завершились, опрашивать нечего.
      - name: Галки проверок
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const run = context.payload.workflow_run
            const sha = run.head_sha

            // Прогон, который ждёт одобрения мейнтейнера или был пропущен, —
            // не повод трогать заметку: её уже написал воркфлоу заметки, и
            // написал точнее. Отменённый прогон, наоборот, должен дойти до
            // отчёта, иначе после ручной отмены в описании навсегда останется
            // «идут проверки».
            const idle = ['action_required', 'skipped']
            if (idle.includes(run.status) || idle.includes(run.conclusion)) {
              core.info(`Прогон проверок в состоянии ${run.status}/${run.conclusion}, делать нечего`)
              core.setOutput('state', 'idle')
              return
            }

            // `workflow_run.pull_requests` пуст для веток из форков. Коммит
            // лежит в `refs/pull/*/head` базового репозитория, и API находит по
            // нему пулреквест.
            const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: sha,
            })
            const pull = pulls.find((item) => item.state === 'open') || pulls[0]
            if (!pull) {
              core.info(`Пулреквест по коммиту ${sha} не нашёлся`)
              core.setOutput('state', 'idle')
              return
            }
            core.setOutput('pull-number', pull.number)

            const names = ['Форматирование', 'Мета', 'Ссылки']
            const { data } = await github.rest.checks.listForRef({ owner, repo, ref: sha, per_page: 100 })
            const checks = names.map((name) => data.check_runs.find((item) => item.name === name))

            // skipped и neutral провалом не считаются. Орфографии в списке нет
            // намеренно: опечатки превью не блокируют, текст как раз удобно
            // вычитывать на превью.
            const passed = ['success', 'skipped', 'neutral']
            // Отменённая проверка — не провал, а незавершённость.
            const unfinished = ['cancelled', 'stale']

            const failed = checks.filter(
              (check) =>
                check &&
                check.status === 'completed' &&
                !passed.includes(check.conclusion) &&
                !unfinished.includes(check.conclusion),
            )
            if (failed.length) {
              core.setOutput('state', 'failed')
              core.setOutput('failed', failed.map((check) => check.name).join(', '))
              return
            }

            const done = checks.every(
              (check) => check && check.status === 'completed' && passed.includes(check.conclusion),
            )
            core.setOutput('state', done ? 'passed' : 'unfinished')

      # Дальше — только если проверки прошли. Заметка о сборке пишется до
      # чекаута форка: пока в рабочем дереве нет чужого кода, писать в
      # пулреквест безопаснее.
      - name: Заметка о сборке
        if: ${{ steps.gate.outputs.state == 'passed' }}
        uses: actions/github-script@v7
        env:
          PULL_NUMBER: ${{ steps.gate.outputs.pull-number }}
        with:
          script: |
            const note = require(`${process.env.GITHUB_WORKSPACE}/base/.github/scripts/preview-note.js`)
            const { owner, repo } = context.repo
            const headSha = process.env.HEAD_SHA

            await note.writeNote({
              github,
              owner,
              repo,
              pullNumber: Number(process.env.PULL_NUMBER),
              message: `Проверки пройдены, идёт сборка превью контента из ${headSha}. [Подробнее](${process.env.RUN_URL})`,
              headSha,
            })

      # Собирает адреса страниц, затронутых пулреквестом. Соответствие пути
      # и адреса разное у разных разделов:
      #   css/optional/index.md   → /css/optional/
      #   pages/about/index.md    → /about/        папка раздела выпадает
      #   interviews/…/index.md   → страницы нет, у вопросов её не бывает
      # Демки, картинки, советы «На практике» и ответы лежат глубже и своих
      # страниц тоже не имеют, поэтому в список не попадают.
      - name: Выборка изменённых материалов
        id: files
        if: ${{ steps.gate.outputs.state == 'passed' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_NUMBER: ${{ steps.gate.outputs.pull-number }}
        run: |
          set -eu
          urls=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${PULL_NUMBER}/files" \
            --jq '.[].filename' \
            | awk -F/ '
                NF == 3 && $3 == "index.md" {
                  if ($1 ~ /^(html|css|js|a11y|tools|recipes|people)$/) print "/" $1 "/" $2 "/"
                  else if ($1 ~ /^(pages|specials)$/) print "/" $2 "/"
                }' \
            | sort -u \
            | tr '\n' ' ')
          echo "urls=$urls" >> "$GITHUB_OUTPUT"
          echo "Затронуто страниц: $(echo $urls | wc -w)"

      - name: Загрузка platform
        if: ${{ steps.gate.outputs.state == 'passed' }}
        uses: actions/checkout@v4
        with:
          repository: doka-guide/platform
      - name: Загрузка контента
        if: ${{ steps.gate.outputs.state == 'passed' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: content
          allow-unsafe-pr-checkout: true
      - name: Загрузка кеша
        if: ${{ steps.gate.outputs.state == 'passed' }}
        uses: actions/checkout@v4
        with:
          repository: doka-guide/cache
          path: cache
      # Версия берётся из .nvmrc платформы: именно её зависимости здесь
      # ставятся. Зашитая версия разъезжается с платформой — так превью и
      # выкатка сломались, когда платформа перешла на Node 24, а здесь
      # осталась двадцатая.
      - uses: actions/setup-node@v4
        if: ${{ steps.gate.outputs.state == 'passed' }}
        with:
          node-version-file: .nvmrc
      - name: Установка модулей
        if: ${{ steps.gate.outputs.state == 'passed' }}
        run: npm ci
      - name: Копирование кеша
        if: ${{ steps.gate.outputs.state == 'passed' }}
        run: cp ./cache/issues.json ./.issues.json

      # Блок со ссылками добавляется к сообщению только когда есть что
      # показать: у пулреквестов, которые правят воркфлоу или служебные файлы,
      # затронутых материалов нет, и раскрывашка там пустая и бессмысленная.
      - name: Формирование ссылок на материалы
        id: links
        if: ${{ steps.gate.outputs.state == 'passed' }}
        env:
          DEPLOY_DOMAIN: https://content-${{ steps.gate.outputs.pull-number }}.dev.doka.guide
        run: |
          set -eu
          items=""
          for url in ${{ steps.files.outputs.urls }}; do
            items="${items}<li><a href=\"${DEPLOY_DOMAIN}${url}\">${url}</a></li>"
          done
          if [ -n "$items" ]; then
            block="<details><summary>Затронутые материалы</summary><ul>${items}</ul></details>"
          else
            block=""
          fi
          echo "list=$block" >> "$GITHUB_OUTPUT"

      - name: Установка ключа для пользователя
        if: ${{ steps.gate.outputs.state == 'passed' }}
        run: |
          set -eu
          mkdir "$HOME/.ssh"
          echo "${{ secrets.DEPLOY_KEY }}" > "$HOME/.ssh/doka_deploy"
          chmod 600 "$HOME/.ssh/doka_deploy"

      # `continue-on-error`, чтобы отчёт написался и о поломке тоже. Красную
      # строку в списке проверок ставит последний шаг джобы.
      - name: Сборка и публикация сайта
        id: build
        if: ${{ steps.gate.outputs.state == 'passed' }}
        continue-on-error: true
        env:
          DEPLOY_DOMAIN: https://content-${{ steps.gate.outputs.pull-number }}.dev.doka.guide
          PULL_NUMBER: ${{ steps.gate.outputs.pull-number }}
        run: |
          set -eu
          cp .env.example .env

          # Сборка молчит около двух минут, а публикация — ещё дольше. Без
          # отметок шаг выглядит зависшим, и непонятно, на чём именно он стоит.
          echo "::group::Сборка сайта"
          echo "Начало: $(date -u +%H:%M:%S) UTC. Сборка занимает пару минут и молчит до конца."
          npm run build
          echo "Готово: $(date -u +%H:%M:%S) UTC. Страниц собрано: $(find dist -name '*.html' | wc -l)."
          echo "::endgroup::"

          echo "::group::Публикация превью"
          echo "Начало: $(date -u +%H:%M:%S) UTC. Отправляется $(du -sh dist | cut -f1)."
          ssh -i $HOME/.ssh/doka_deploy -o StrictHostKeyChecking=no deploy@dev.doka.guide mkdir -p /web/sites/dev.doka.guide/content/${PULL_NUMBER}
          # --info=progress2 показывает общий прогресс одной обновляемой строкой,
          # а не портянку из десятков тысяч имён файлов, как прежний --progress.
          cd dist && rsync -e "ssh -i $HOME/.ssh/doka_deploy -o StrictHostKeyChecking=no" \
            --archive --compress --delete --info=progress2 \
            . deploy@dev.doka.guide:/web/sites/dev.doka.guide/content/${PULL_NUMBER}
          echo ""
          echo "Готово: $(date -u +%H:%M:%S) UTC."
          echo "::endgroup::"

          echo "Ссылка на превью — ${DEPLOY_DOMAIN}"

      # Итоговая заметка. always(), иначе при упавших проверках или сборке в
      # описании навсегда останется «идёт сборка...».
      - name: Отчёт в пулреквесте
        if: ${{ always() && steps.gate.outputs.state != '' && steps.gate.outputs.state != 'idle' }}
        uses: actions/github-script@v7
        env:
          DEPLOY_DOMAIN: https://content-${{ steps.gate.outputs.pull-number }}.dev.doka.guide
          FAILED: ${{ steps.gate.outputs.failed }}
          IS_PUBLISHED: ${{ steps.build.outcome == 'success' }}
          LINKS: ${{ steps.links.outputs.list }}
          PULL_NUMBER: ${{ steps.gate.outputs.pull-number }}
          STATE: ${{ steps.gate.outputs.state }}
        with:
          script: |
            const note = require(`${process.env.GITHUB_WORKSPACE}/base/.github/scripts/preview-note.js`)
            const { owner, repo } = context.repo
            const pullNumber = Number(process.env.PULL_NUMBER)
            const sha = process.env.HEAD_SHA
            if (!pullNumber) {
              core.warning('Номер пулреквеста не определился, заметку не пишем')
              return
            }

            const state = process.env.STATE
            const isPublished = process.env.IS_PUBLISHED === 'true'

            // У гейта три исхода, и у каждого своя формулировка: раньше на всё,
            // кроме успеха, писалось «не прошли проверки» — в том числе когда
            // они не запускались вовсе.
            let message
            if (state === 'failed') {
              const failed = process.env.FAILED ? ` (${process.env.FAILED})` : ''
              message = `Превью контента из ${sha} не опубликовано: не прошли проверки пулреквеста${failed}. [Подробнее](${process.env.RUN_URL})`
            } else if (state !== 'passed') {
              message = `Превью контента из ${sha} не опубликовано: проверки пулреквеста не завершились. [Подробнее](${process.env.RUN_URL})`
            } else if (isPublished) {
              message = `<a href="${process.env.DEPLOY_DOMAIN}">Превью контента</a> из ${sha} опубликовано.${process.env.LINKS || ''}`
            } else {
              message = `Превью контента из ${sha} не опубликовано. Ошибка сборки или публикации. [Подробнее](${process.env.RUN_URL})`
            }

            const written = await note.writeNote({ github, owner, repo, pullNumber, message, headSha: sha })
            if (written === null) {
              core.info(`Коммит ${sha} устарел, заметку не трогаем`)
            }

      # Комментарии прошлой схемы. Убираем оставшиеся, чтобы в ленте не висело
      # вечное «Идёт сборка...». Шаг можно удалить, когда их не останется.
      - name: Уборка старых комментариев
        if: ${{ always() && steps.gate.outputs.pull-number != '' }}
        uses: actions/github-script@v7
        continue-on-error: true
        env:
          PULL_NUMBER: ${{ steps.gate.outputs.pull-number }}
        with:
          script: |
            const { owner, repo } = context.repo
            const issue_number = Number(process.env.PULL_NUMBER)
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            })
            for (const comment of comments) {
              const isBot = comment.user?.login === 'github-actions[bot]'
              if (isBot && (comment.body || '').includes('Превью контента')) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: comment.id })
              }
            }

      # Красная строка — только на нашей поломке: провал проверок пулреквеста
      # уже виден отдельной красной галкой, дублировать его незачем. Раньше эту
      # роль играла галка «Превью», которую джоба заводила через API, — но
      # джоба и так своя строка в списке проверок, и галка была дублем.
      - name: Итог
        if: ${{ always() && steps.build.outcome == 'failure' }}
        run: |
          echo "::error::Сборка или публикация превью не удалась"
          exit 1
