# Ченджлог наполняется по слитому пулреквесту, а не по последним коммитам ветки:
# так известны и точный набор правок, и автор, и ярлыки.
# Тесты: node --test .github/scripts/update-changelog.test.js

name: Update CHANGELOG

on:
  pull_request_target:
    types:
      - closed

permissions:
  contents: read

jobs:
  update_changelog:
    name: Ченджлог
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      # Чекаутится main, а не ветка пулреквеста: код из форка здесь не
      # выполняется, файлы читаются из истории как данные.
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.DOKA_BOT_ACCESS_TOKEN }}
          # Скрипту нужен коммит слияния вместе с его родителем, а он может быть
          # уже не в вершине ветки: следом за мёржем в main пишут «Update Dates»
          # и «Frontmatter Lint».
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Пулреквесты сливаются пачками, и пока джоба работает, main уезжает
      # вперёд. Очередь из одной джобы (concurrency) здесь не годится: третий
      # мёрдж отменил бы второй, ожидающий, вместе с его записью в ченджлоге.
      # Поэтому на отказ в пуше ченджлог перечитывается с новой вершины и
      # заполняется заново — скрипт видит уже добавленные записи и не дублирует
      # их.
      - name: Ищет материалы пулреквеста и дополняет ченджлог
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          MERGED_AT: ${{ github.event.pull_request.merged_at }}
        run: |
          git config user.name "Doka Dog"
          git config user.email "hi@doka.guide"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --quiet --hard origin/main

            node .github/scripts/update-changelog.js

            if [[ -z $(git status -s) ]]; then
              echo "Ченджлог не изменился"
              exit 0
            fi

            git add CHANGELOG.md
            git commit -m "Обновляет ченджлог" --author "Doka Dog <hi@doka.guide>"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Пуш отклонён, попытка $attempt из 5"
            # Ждём только между попытками. `[[ ]] && sleep` здесь нельзя:
            # на последней итерации он вернёт ненулевой код, и `bash -e`
            # оборвёт шаг, не дав напечатать, чем всё кончилось.
            if [[ $attempt -lt 5 ]]; then
              sleep $((attempt * 5))
            fi
          done

          echo "Не удалось записать ченджлог за пять попыток"
          exit 1
