name: PR Labels

on:
  pull_request_target:

# Новый коммит в пулреквест отменяет прогон на предыдущем, чтобы галки
# относились к актуальному коммиту, а не к устаревшему.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Ярлыки пулреквеста — это ярлыки задачи, но для пулреквеста их хватает
# `pull-requests: write`.
permissions:
  contents: read
  pull-requests: write

jobs:
  labels:
    name: Ярлыки
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Правила ярлыков — из ветки по умолчанию, а не из пулреквеста: иначе
      # форк сам переписал бы себе `.github/labeler.yml`. Копия уходит во
      # временную папку, потому что следующий чекаут вычищает рабочую.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/labeler.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Копия правил ярлыков
        run: cp .github/labeler.yml "$RUNNER_TEMP/labeler.yml"
      # Голова пулреквеста всё же нужна: правила `meta:` читают шапку
      # изменённых статей с диска.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
          # Код PR здесь не запускается, но токен с записью в `.git/config`
          # пережил бы чекаут. Ярлыкам он передаётся отдельно, через `token`.
          persist-credentials: false
      - name: Устанавливает необходимые ярлыки
        uses: doka-guide/doka-labeler@0726b96979f0f57387bbeda77c4ffe61ece48efd # v1.0.2
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          strategy: append
          config: ${{ runner.temp }}/labeler.yml
