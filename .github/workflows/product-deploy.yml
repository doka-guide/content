name: Product Deploy

# Цепочка: push в main → Main Maintenance → выкатка. Раньше звеньев было
# четыре, и выкатка стартовала по нескольку раз на один мёрж — по разу на
# каждый пуш бота.
on:
  workflow_run:
    workflows:
      - "Main Maintenance"
    branches:
      - main
    types:
      - completed

# Группа без cancel-in-progress: оборванный `rsync --delete` оставил бы сайт
# наполовину синхронизированным. Лишняя выкатка подождёт своей очереди.
concurrency:
  group: Product Deploy

permissions:
  contents: read

jobs:
  product-deploy:
    # `completed` приходит и на упавший прогон, и на отменённый, и на
    # пропущенный. Без этой проверки в продакшен уехал бы результат
    # обслуживания, которое не отработало, — а заодно выкатка запускалась бы на
    # собственном коммите бота, где обслуживание пропущено.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PATH_TO_CONTENT: ./content
    steps:
      - name: Загрузка platform
        uses: actions/checkout@v4
        with:
          repository: doka-guide/platform
      - name: Загрузка контента
        uses: actions/checkout@v4
        with:
          path: content
      - name: Загрузка кеша
        uses: actions/checkout@v4
        with:
          repository: doka-guide/cache
          path: cache
      # Версия берётся из .nvmrc платформы: именно её зависимости здесь
      # ставятся. Зашитая версия разъезжается с платформой — так превью и
      # выкатка сломались, когда платформа перешла на Node 24, а здесь
      # осталась двадцатая.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Кэширование модулей
        uses: actions/cache@v3
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - name: Установка ключа для пользователя
        run: |
          set -eu
          mkdir "$HOME/.ssh"
          echo "${{ secrets.DEPLOY_KEY }}" > "$HOME/.ssh/doka_deploy"
          chmod 600 "$HOME/.ssh/doka_deploy"
          echo "${{ secrets.DEPLOY_CONFIG }}" > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          ssh -o StrictHostKeyChecking=no deploy@dev.doka.guide
      - name: Установка модулей
        run: npm ci
      - name: Копирование кеша
        run: cp ./cache/issues.json ./.issues.json
      - name: Сборка сайта
        run: |
          cp .env.example .env
          npm run build
      - name: Публикация сайта
        run: |
          cd dist
          rsync --exclude 'api.json' --exclude 'mail' --archive --progress --compress --delete . dev.doka.guide:/web/sites/doka.guide/www/
