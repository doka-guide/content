name: Product Deploy

# Цепочка: push в main → Main Maintenance → выкатка в платформе.
#
# Сайт собирает и выкладывает «Product Deploy» репозитория платформы, здесь его
# только запускают и ждут. У платформы проверка артефакта, `--delete-after`,
# `--max-delete` и одна очередь на оба репозитория. Своя копия rsync шла в
# отдельной очереди и могла писать в прод одновременно с платформой.
on:
  workflow_run:
    workflows:
      - "Main Maintenance"
    branches:
      - main
    types:
      - completed

permissions:
  contents: read

jobs:
  product-deploy:
    # `completed` приходит и на упавший прогон, и на отменённый, и на
    # пропущенный. Без этой проверки в продакшен уехал бы результат
    # обслуживания, которое не отработало, — а заодно выкатка запускалась бы на
    # собственном коммите бота, где обслуживание пропущено.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # С запасом: запуск может ждать в очереди платформы чужую выкатку.
    timeout-minutes: 90
    steps:
      # PLATFORM_DEPLOY_TOKEN — fine-grained токен бота: только
      # doka-guide/platform, Actions: Read and write. GITHUB_TOKEN этого
      # репозитория чужие воркфлоу запускать не может.
      #
      # Прогон ждёт выкатку до конца, чтобы её падение было видно здесь: письмо
      # об упавшем прогоне получит тот, кто мёржил, а не владелец токена.
      - name: Выкатка через платформу
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_DEPLOY_TOKEN }}
          PLATFORM: doka-guide/platform
        run: |
          set -eu
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Нет секрета PLATFORM_DEPLOY_TOKEN, выкатку запустить нечем."
            exit 1
          fi

          # Номер запуска возвращает сам API (`return_run_details`), искать
          # свой запуск среди чужих не нужно.
          RUN_ID=$(gh api --method POST "repos/$PLATFORM/actions/workflows/product-deploy.yml/dispatches" \
            -f ref=main -F return_run_details=true --jq '.workflow_run_id // empty')
          if [ -z "$RUN_ID" ]; then
            echo "::error::Платформа не вернула номер запуска выкатки."
            exit 1
          fi
          echo "Выкатка: https://github.com/$PLATFORM/actions/runs/$RUN_ID"

          # Свой цикл, а не `gh run watch`: тому для аннотаций нужны права на
          # check-runs, которых у токена нет. Сбой сети — не повод ронять шаг,
          # следующая попытка через полминуты.
          STATUS=""
          until [ "$STATUS" = "completed" ]; do
            sleep 30
            STATUS=$(gh run view "$RUN_ID" -R "$PLATFORM" --json status --jq .status || true)
          done

          # Смотрим джобу публикации, а не весь запуск: рядом идёт валидация
          # разметки, и её падение сайт не останавливает. Имя джобы должно
          # совпадать с `name` в product-deploy.yml платформы.
          DEPLOYED=$(gh run view "$RUN_ID" -R "$PLATFORM" --json jobs \
            --jq '.jobs[] | select(.name == "Публикация сайта") | .conclusion')
          CONCLUSION=$(gh run view "$RUN_ID" -R "$PLATFORM" --json conclusion --jq .conclusion)
          if [ "$DEPLOYED" = "success" ]; then
            echo "Сайт выкачен."
            [ "$CONCLUSION" = "success" ] || echo "::warning::В запуске платформы есть упавшие джобы, сайт при этом выкачен."
            exit 0
          fi

          # Ждущий запуск GitHub отменяет, когда в очередь встаёт более новый.
          # Тот соберёт свежий main, в том числе этот коммит. Отмена без более
          # нового запуска — ручная или по таймауту, это провал.
          NEWER=$(gh run list -R "$PLATFORM" --workflow product-deploy.yml --limit 1 \
            --json databaseId --jq ".[] | select(.databaseId > $RUN_ID) | .databaseId")
          if [ "$CONCLUSION" = "cancelled" ] && [ -n "$NEWER" ]; then
            echo "::notice::Выкатку вытеснил запуск $NEWER, он выкатит и этот коммит."
            exit 0
          fi
          echo "::error::Сайт не выкачен: запуск платформы завершился так: $CONCLUSION."
          exit 1
