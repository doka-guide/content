name: Featured Articles

on:
  schedule:
    - cron: '0 5 * * 5'

permissions:
  contents: read

jobs:
  featured-articles:
    name: Избранные статьи
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.DOKA_BOT_ACCESS_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Ставится один раз, а не на каждую попытку: цикл повторов переделывает
      # только саму работу.
      - name: Установка зависимостей скрипта
        run: |
          npm install --global gray-matter
          npm link gray-matter
      # Общий цикл повторов с обслуживанием main. В гонке мёржей этот воркфлоу
      # не участвует — он ходит раз в неделю по расписанию, — но пушит в ту же
      # main и однажды упал бы так же, столкнувшись с ботом обслуживания.
      - name: Обработка featured-статей
        run: |
          bash .github/scripts/commit-and-push.sh \
            "Обновляет featured-статьи" \
            "node .github/scripts/featured-articles.js" \
            settings/featured.md
