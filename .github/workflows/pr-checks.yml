name: PR Checks

on:
  pull_request:

# Новый коммит в пулреквест отменяет прогон на предыдущем, чтобы галки
# относились к актуальному коммиту, а не к устаревшему.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Проверки только читают: чекаут и список изменённых файлов пулреквеста.
# Права на запись здесь опасны — код из форка выполняется под этим токеном.
permissions:
  contents: read
  pull-requests: read

jobs:
  editorconfig:
    name: Форматирование
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      # Список файлов пулреквеста — из API, без стороннего экшена. Удалённые
      # файлы проверять нечем. Переименованные без правок пропускаются: иначе
      # переезд папки статьи падал бы на чужих старых ошибках.
      # Файл со списком по строке на имя: имена не подставляются в shell.
      - name: Изменённые файлы
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_URL: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files
        run: |
          gh api --paginate "$PULL_URL?per_page=100" \
            --jq '.[] | select(.status != "removed" and (.status != "renamed" or .changes > 0)) | .filename' > "$RUNNER_TEMP/files.txt"
          echo "Изменено файлов: $(wc -l < "$RUNNER_TEMP/files.txt")"
      # Версии обёртки и бинарника закреплены: обёртка по умолчанию качает
      # бинарник «latest», и проверка меняла поведение сама по себе.
      - name: Работает линтер
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EC_VERSION: v4.0.2
        run: |
          npm install --global --ignore-scripts editorconfig-checker@7.0.0
          if grep -qxF '.editorconfig' "$RUNNER_TEMP/files.txt"; then
            echo "Проверка для всех файлов"
            editorconfig-checker
            exit 0
          fi
          while IFS= read -r changed_file; do
            echo "Проверка для ${changed_file}"
            editorconfig-checker "$changed_file" < /dev/null
          done < "$RUNNER_TEMP/files.txt"
  frontmatter-checker:
    name: Мета
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      # Список файлов — как в «Форматировании» выше.
      - name: Изменённые файлы
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_URL: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files
        run: |
          gh api --paginate "$PULL_URL?per_page=100" \
            --jq '.[] | select(.status != "removed" and (.status != "renamed" or .changes > 0)) | .filename' > "$RUNNER_TEMP/files.txt"
          echo "Изменено файлов: $(wc -l < "$RUNNER_TEMP/files.txt")"
      - name: Работает линтер
        run: |
          # Цифры в слаге тоже бывают: `html/h1-h6`, `tools/ipv6-for-webdevs`.
          # Без них grep не находил такие файлы, и проверка шла вхолостую.
          mapfile -t files < <(grep -x -E '(css|html|js|tools|a11y|recipes)/[a-z0-9-]+/index.md' "$RUNNER_TEMP/files.txt" || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "В PR нет файлов для проверки"
            exit 0
          fi
          echo "Проверка для файлов из PR"
          npx --yes yaml-cat@0.4.2 --format json --output result.json "${files[@]}"
          node .github/scripts/frontmatter.js
  # Обе проверки текста в одной джобе: чекаут и Node общие, а сами проверки
  # занимают секунды. Шаги не прерывают друг друга — при падении видно оба
  # отчёта сразу, а не только первый упавший.
  # Тесты: node --test .github/scripts/check-spelling.test.mjs
  #        node --test .github/scripts/check-yo.test.mjs
  spelling:
    name: Орфография
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      # Список файлов — как в «Форматировании» выше.
      - name: Изменённые файлы
        id: files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_URL: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files
        run: |
          gh api --paginate "$PULL_URL?per_page=100" \
            --jq '.[] | select(.status != "removed" and (.status != "renamed" or .changes > 0)) | .filename' > "$RUNNER_TEMP/files.txt"
          echo "Изменено файлов: $(wc -l < "$RUNNER_TEMP/files.txt")"
      - name: Незнакомые слова
        if: ${{ !cancelled() && steps.files.outcome == 'success' }}
        run: |
          mapfile -t files < <(grep -E '\.md$' "$RUNNER_TEMP/files.txt" || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "В пулреквесте нет файлов для проверки"
            exit 0
          fi
          node .github/scripts/check-spelling.mjs "${files[@]}"
      - name: Буква ё
        if: ${{ !cancelled() && steps.files.outcome == 'success' }}
        run: |
          mapfile -t files < <(grep -E '\.md$' "$RUNNER_TEMP/files.txt" || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "В пулреквесте нет файлов для проверки"
            exit 0
          fi
          node .github/scripts/check-yo.mjs "${files[@]}"

  # Без `needs`: проверка идёт наравне с остальными, а не после них. Иначе
  # опечатка в отступе прятала битые ссылки до следующего пуша — человек чинил
  # по одной находке за круг.
  link-checker:
    name: Ссылки
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      # Здесь нужны и удалённые файлы: на них могли ссылаться другие статьи.
      - name: Изменённые файлы
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_URL: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files
        run: |
          # Отдельной командой, а не в конвейере: шаг идёт без pipefail, и сбой
          # API в начале конвейера дал бы пустой список и ложный зелёный.
          gh api --paginate "$PULL_URL?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/all.txt"
          { grep -E '\.md$' "$RUNNER_TEMP/all.txt" || true; } | sort -u > "$RUNNER_TEMP/files.txt"
          echo "Изменено файлов Markdown: $(wc -l < "$RUNNER_TEMP/files.txt")"
      - name: Проверяет ссылки
        run: |
          mapfile -t files < "$RUNNER_TEMP/files.txt"
          if [ ${#files[@]} -eq 0 ]; then
            echo "В пулреквесте нет файлов Markdown"
            exit 0
          fi
          npm install --no-save --ignore-scripts transliteration@2.7.0
          node .github/scripts/link-check.js "${files[@]}"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
