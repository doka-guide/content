name: EditorConfig

on:
  push:
    branches:
      - main

# Проверка только читает: чекаут и список изменённых файлов коммита.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: files
        uses: Ana06/get-changed-files@v2.3.0
      - name: Проверка линтером
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install editorconfig-checker --global
          config=.editorconfig
          for changed_file in ${{ steps.files.outputs.all }}; do
            if [ "$changed_file" == "$config" ]
            then
              echo "Проверка для всех файлов"
              editorconfig-checker
              break
            elif [ -f "$changed_file" ]
            then
              echo "Проверка для ${changed_file}"
              editorconfig-checker "${changed_file}"
            else
              # Удалённые и переехавшие файлы тоже приходят в списке изменённых,
              # а `editorconfig-checker` на несуществующем пути падает с паникой
              # и роняет всю проверку.
              echo "Пропускаем ${changed_file}: файла больше нет"
            fi
          done
