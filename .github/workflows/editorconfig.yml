name: EditorConfig

on:
  push:
    branches:
      - main

# Проверка только читает: чекаут и список изменённых файлов коммита.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      # Список файлов коммита — из API сравнения, без стороннего экшена.
      # Удалённые файлы проверять нечем: `editorconfig-checker` на
      # несуществующем пути падает с паникой и роняет всю проверку.
      - name: Изменённые файлы
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPARE_URL: repos/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.event.after }}
        run: |
          gh api "$COMPARE_URL" \
            --jq '.files[] | select(.status != "removed") | .filename' > "$RUNNER_TEMP/files.txt"
          echo "Изменено файлов: $(wc -l < "$RUNNER_TEMP/files.txt")"
      # Версии обёртки и бинарника закреплены: обёртка по умолчанию качает
      # бинарник «latest», и проверка меняла поведение сама по себе.
      - name: Проверка линтером
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EC_VERSION: v4.0.2
        run: |
          npm install --global --ignore-scripts editorconfig-checker@7.0.0
          if grep -qxF '.editorconfig' "$RUNNER_TEMP/files.txt"; then
            echo "Проверка для всех файлов"
            editorconfig-checker
            exit 0
          fi
          while IFS= read -r changed_file; do
            # Файл мог исчезнуть следующим коммитом того же пуша.
            if [ -f "$changed_file" ]; then
              echo "Проверка для ${changed_file}"
              editorconfig-checker "$changed_file" < /dev/null
            fi
          done < "$RUNNER_TEMP/files.txt"
